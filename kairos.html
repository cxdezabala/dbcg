  const [selectedSectorId, setSelectedSectorId] = useState('manufactura');
  const [simSectorId, setSimSectorId] = useState('manufactura');
  const [simDriverId, setSimDriverId] = useState('acero');
  const [simPeso, setSimPeso] = useState(null);
  const [simVariacion, setSimVariacion] = useState(null);
  const [estrVars, setEstrVars] = useState({});
  const [relevantInsumos, setRelevantInsumos] = useState({});
  const [inflGeneral, setInflGeneral] = useState(null);
  const [copilotOpen, setCopilotOpen] = useState(false);
  const [copilotThread, setCopilotThread] = useState([]);
  const [feedOpen, setFeedOpen] = useState(true);
  const [feedExpanded, setFeedExpanded] = useState(null);

  useEffect(() => { const t = setTimeout(() => setBriefReady(true), 550); return () => clearTimeout(t); }, []);

  const effSector = SECTORS_RAW[(profile && profile.sectorId) || selectedSectorId];

  const tickerRaw = DRIVERS_RAW.map(d => ({ name: d.name, valueLabel: fmtPct(d.yoy), color: driverColor(d.yoy), fuente: d.fuente }));
  const tickerLoop = tickerRaw.concat(tickerRaw);

  const showOnboarding = !profile && !onboardingDismissed;
  const canConfirmProfile = !!(onboardSector && onboardRevenue && onboardHeadcount);
  const confirmProfile = () => { setProfile({ sectorId: onboardSector, revenueBandId: onboardRevenue, headcountBandId: onboardHeadcount }); setSelectedSectorId(onboardSector); setSimSectorId(onboardSector); };
  const editProfile = () => { setOnboardSector(profile ? profile.sectorId : onboardSector); setOnboardRevenue(profile ? profile.revenueBandId : onboardRevenue); setOnboardHeadcount(profile ? profile.headcountBandId : onboardHeadcount); setProfile(null); setOnboardingDismissed(false); };
  const profileCard = profile ? { sector: effSector.name, revenue: REVENUE_BANDS.find(b => b.id === profile.revenueBandId).label, headcount: HEADCOUNT_BANDS.find(b => b.id === profile.headcountBandId).label + ' empleados' } : { sector:'', revenue:'', headcount:'' };
  const revBand = profile ? REVENUE_BANDS.find(b => b.id === profile.revenueBandId) : null;
  const profileSummary = profile ? `${effSector.name} · ${revBand.label}` : 'Sin personalizar — promedios de sector';

  const topDriver = DRIVERS_RAW.filter(d => effSector.driversIds.includes(d.id)).sort((a,b) => Math.abs(b.yoy) - Math.abs(a.yoy))[0];
  const brief = {
    changed: `${topDriver.name} se ha movido ${fmtPct(topDriver.yoy)} interanual, la variación más marcada entre los drivers de tu sector.`,
    matters: `Representa cerca de un ${effSector.pesoPorDriver[topDriver.id] || 0}% de tu estructura de coste — un movimiento sostenido en esta magnitud presiona el margen de la empresa tipo del sector.`,
    consider: `Revisa el Impact Simulator para cuantificar el efecto en tu margen y valora la prioridad correspondiente en el Decision Center.`,
  };
  const decisionsForSector = DECISIONS[effSector.id];
  const topDecisionTitle = decisionsForSector[0].title;
  const causalityChain = [ topDriver.name, 'Costes operativos', 'EBITDA', 'Cash flow', 'Libertad estratégica' ];

  const selectedDriverRaw = DRIVERS_RAW.find(d => d.id === selectedDriverId) || DRIVERS_RAW[0];

  const sectorTiles = SECTOR_TILE_ORDER.map(key => SECTORS_RAW[key] || { id:key, name:key, locked:true });
  const sectorLocked = LOCKED_SECTORS.includes(selectedSectorId);
  let sectorDetail = { estructura: [], driverChips: [], riesgos: [], oportunidades: [] };
  if (!sectorLocked) {
    const sec = SECTORS_RAW[selectedSectorId];
    sectorDetail = { estructura: sec.estructura, riesgos: sec.riesgos, oportunidades: sec.oportunidades,
      driverChips: sec.driversIds.map(id => DRIVERS_RAW.find(x => x.id === id)) };
  }

  const simSector = SECTORS_RAW[simSectorId] || effSector;
  const structureLinkedIds = new Set(Object.values(simSector.estructuraDriverMap || {}).flat());
  const simDriverIds = simSector.driversIds.filter(id => structureLinkedIds.has(id));
  const activeSimDriverId = simDriverIds.includes(simDriverId) ? simDriverId : simDriverIds[0];
  const simDriverRaw = DRIVERS_RAW.find(d => d.id === activeSimDriverId);
  const pesoDefault = simSector.pesoPorDriver[activeSimDriverId] || 10;
  const peso = simPeso ?? pesoDefault;
  const variacion = simVariacion ?? Math.round(simDriverRaw.yoy);
  const margenActual = simSector.margenBase;
  const costeActual = 100 - margenActual;
  const costeNuevo = costeActual * (1 + (peso / 100) * (variacion / 100));
  const margenNuevo = 100 - costeNuevo;
  const delta = margenNuevo - margenActual;
  const deltaColor = delta < -0.05 ? ACCENT_700 : (delta > 0.05 ? TEXT : N600);
  let simNarrativa;
  if (delta < -0.05) simNarrativa = `Si ${simDriverRaw.name.toLowerCase()} varía un ${fmtPct(variacion)} y pesa un ${peso}% de tu coste, tu margen bajaría de ${margenActual.toFixed(1)}% a ${margenNuevo.toFixed(1)}% — ${Math.abs(delta).toFixed(1)} puntos porcentuales que conviene anticipar.`;
  else if (delta > 0.05) simNarrativa = `Con esta variación, tu margen mejoraría de ${margenActual.toFixed(1)}% a ${margenNuevo.toFixed(1)}%, ganando ${delta.toFixed(1)} puntos porcentuales.`;
  else simNarrativa = 'Con estos parámetros el impacto sobre el margen es prácticamente neutro.';
  const hasProfile = !!profile;

  const costeActualComb = 100 - simSector.margenBase;
  let costeCombinadoNuevo = 0;
  const estructuraMap = simSector.estructuraDriverMap || {};
  const estructuraSim = simSector.estructura.map(([label, pctBase, color], idx) => {
    const key = simSectorId + '_' + idx;
    const linkedIds = estructuraMap[idx] || [];
    const isActiveLine = linkedIds.includes(activeSimDriverId);
    const hasInsumoPicker = linkedIds.length > 1;
    const pct = (isActiveLine && !hasInsumoPicker) ? peso : pctBase;
    const defaultSelected = linkedIds.includes(activeSimDriverId) ? [activeSimDriverId] : (linkedIds.length ? [linkedIds[0]] : []);
    const selectedIds = relevantInsumos[key] || defaultSelected;
    let defaultVar = 0;
    if (selectedIds.length) {
      const weighted = selectedIds.map(id => ({ w: id === activeSimDriverId ? peso : (simSector.pesoPorDriver[id] || 1), val: id === activeSimDriverId ? variacion : DRIVERS_RAW.find(d => d.id === id).yoy }));
      const totalW = weighted.reduce((a, x) => a + x.w, 0) || 1;
      defaultVar = weighted.reduce((a, x) => a + x.val * x.w, 0) / totalW;
    }
    const v = isActiveLine ? defaultVar : (estrVars[key] ?? defaultVar);
    const shareRevenue = costeActualComb * (pct / 100);
    const contribPP = shareRevenue * (v / 100);
    costeCombinadoNuevo += shareRevenue * (1 + v / 100);
    return { label, color, pct, v, contribPP, key, isActiveLine, hasInsumoPicker, linkedIds, selectedIds };
  });
  const currentInflGeneral = inflGeneral ?? DRIVERS_RAW.find(d => d.id === 'inflacion').yoy;
  costeCombinadoNuevo += costeActualComb * (currentInflGeneral / 100);
  const tiposLabel = fmtPct(DRIVERS_RAW.find(d => d.id === 'tipos').yoy);
  const margenCombinado = 100 - costeCombinadoNuevo;
  const deltaComb = margenCombinado - simSector.margenBase;
  const deltaCombColor = deltaComb < -0.05 ? ACCENT_700 : (deltaComb > 0.05 ? TEXT : N600);
  let simCombNarrativa;
  if (deltaComb < -0.05) simCombNarrativa = `Sumando las variaciones fijadas en cada partida, el margen caería de ${simSector.margenBase.toFixed(1)}% a ${margenCombinado.toFixed(1)}%, una pérdida combinada de ${Math.abs(deltaComb).toFixed(1)} puntos porcentuales.`;
  else if (deltaComb > 0.05) simCombNarrativa = `Con estas variaciones combinadas, el margen mejoraría de ${simSector.margenBase.toFixed(1)}% a ${margenCombinado.toFixed(1)}%, ganando ${deltaComb.toFixed(1)} puntos porcentuales.`;
  else simCombNarrativa = 'Con los valores actuales de cada partida, el efecto combinado sobre el margen es prácticamente neutro.';
  let ebitdaCombImpactLabel = '';
  if (hasProfile) { const band = REVENUE_BANDS.find(b => b.id === profile.revenueBandId); ebitdaCombImpactLabel = fmtEur(Math.round(band.mid * 1000000 * (deltaComb / 100))); }

  const askCopilot = (userText, aiText) => setCopilotThread(t => [...t, { role:'user', text:userText }, { role:'ai', text:aiText }]);
  const copilotPrompts = [
    { label:'¿Qué ha cambiado hoy?', a:() => askCopilot('¿Qué ha cambiado hoy?', `${brief.changed} ¿Quieres que lo traduzca a un número de margen para tu negocio en el Simulador?`) },
    { label:'¿Debería subir precios ahora?', a:() => askCopilot('¿Debería subir precios ahora?', `Depende de cuánta demanda perderías. Con la presión actual de ${topDriver.name.toLowerCase()}, un traslado parcial de precio suele compensar sin dañar volumen. ¿Sabes qué elasticidad tiene tu producto principal?`) },
    { label:'Explica de dónde sale esta previsión', a:() => askCopilot('Explica de dónde sale esta previsión', `Uso la estructura de coste promedio del sector (Banco de España — Central de Balances) y la variación publicada por la fuente oficial del driver. No conozco tus cifras reales, así que todo esto es una estimación modelada, no un dato de tu empresa.`) },
    { label:'¿Qué prioridad debería mirar primero?', a:() => askCopilot('¿Qué prioridad debería mirar primero?', `Yo empezaría por "${topDecisionTitle}" — es la de mayor impacto y urgencia combinados ahora mismo. ¿Quieres que te explique el razonamiento completo?`) },
    { label:'¿Cómo negocio la tarifa eléctrica?', a:() => askCopilot('¿Cómo negocio la tarifa eléctrica?', `Tres pasos concretos: 1) pide oferta a al menos dos comercializadoras más antes de renovar, usando tu curva de consumo de los últimos 12 meses; 2) valora fijar precio a plazo si tu volumen es predecible, para eliminar volatilidad; 3) pregunta por descuento por compromiso de permanencia o por desplazar consumo a horas valle. ¿Quieres que lo lleve al Simulador para ver cuánto margen liberaría un 5-10% de ahorro en tarifa?`) },
  ];

  const times = ['hace 32 min', 'hace 1 h', 'hace 3 h', 'hace 5 h', 'hace 9 h', 'hace 1 día'];
  const feedItems = DRIVERS_RAW.slice(0, 6).map((d, i) => ({ time: times[i], fuente: d.fuente, text: `${d.name}: ${fmtPct(d.yoy)} interanual`, detalle: d.desc, i }));

  const tabs = [ ['brief','Executive Brief'], ['drivers','Drivers'], ['sectors','Sector Intelligence'], ['simulator','Impact Simulator'], ['decisions','Decision Center'], ['opportunities','Opportunities'] ];

              <span style={{fontWeight:800, color:t.color}}>{t.valueLabel}</span>
              <span style={{color:N500}}>{t.fuente}</span>
            </span>

        </div>
      </div>

          <a href="index.html" style={{textDecoration:'none'}}>{tag('by DBCG','outline')}</a>
        </span>
        <span style={{display:'flex', alignItems:'center', gap:16, flexWrap:'wrap'}}>
          {tabs.map(([id,label]) => (
            <span key={id} onClick={() => setTab(id)} style={{cursor:'pointer', fontSize:14, fontWeight: tab===id?700:400, color: tab===id?ACCENT_700:TEXT}}>{label}</span>
          ))}
        </span>
        <span style={{display:'flex', alignItems:'center', gap:12, marginLeft:'auto'}}>
          <span style={{fontSize:11, whiteSpace:'nowrap', color:N600}}>{profileSummary}</span>
          <Btn kind={copilotOpen?'primary':'secondary'} onClick={() => setCopilotOpen(!copilotOpen)} style={{whiteSpace:'nowrap', display:'flex', alignItems:'center', gap:8}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:'currentColor',display:'inline-block',animation:'krs-pulse 2s ease-in-out infinite'}}></span>Brandt AI
          </Btn>
        </span>
      </div>

      <div style={{flex:1, display:'flex', minHeight:0}}>

          {showOnboarding && (
            <Card tint style={{marginBottom:32}}>

                  <h3 style={{marginTop:6, maxWidth:'50ch'}}>Dinos tu sector y tamaño para traducir las cifras de mercado a tu margen, no al promedio genérico.</h3>

              </div>

                      <label key={sec.id} className="seg-opt">
                        <input type="radio" name="onbSector" checked={onboardSector===sec.id} onChange={() => setOnboardSector(sec.id)}/>{sec.name}

                        <input type="radio" name="onbRevenue" checked={onboardRevenue===b.id} onChange={() => setOnboardRevenue(b.id)}/>{b.label}

              <Hr/>
              {!briefReady ? (
                <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:16}}>
                  {[0,1,2].map(i => <div key={i} style={{height:140, background:SURFACE, animation:'krs-shimmer 1.4s ease-in-out infinite'}}/>)}
                </div>
              ) : (
                <div>
                  <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:16}}>
                    <Card><Kicker>Qué cambió</Kicker><div style={{fontSize:15, fontWeight:600, marginTop:8}}>{brief.changed}</div></Card>
                    <Card><Kicker>Por qué importa</Kicker><div style={{fontSize:15, fontWeight:600, marginTop:8}}>{brief.matters}</div></Card>
                    <Card><Kicker>Qué considerar</Kicker><div style={{fontSize:15, fontWeight:600, marginTop:8}}>{brief.consider}</div></Card>
                  </div>
                  <h6 style={{marginTop:32, fontSize:14}}>Cadena de causalidad — {topDriver.name}</h6>
                  <div style={{display:'flex', alignItems:'center', gap:8, marginTop:12, flexWrap:'wrap'}}>
                    {causalityChain.map((c,i) => (
                      <span key={i} style={{display:'flex', alignItems:'center', gap:8}}>
                        {tag(c, i===0?'accent':'neutral', {fontSize:12.5, padding:'8px 14px'})}

                  </div>
                  <Card style={{marginTop:32, display:'flex', flexDirection:'row', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap'}}>
                    <span style={{fontSize:13}}>Prioridad principal en tu Decision Center: <b>{topDecisionTitle}</b></span>
                    <Btn kind="ghost" onClick={() => setTab('decisions')}>Ver Decision Center →</Btn>
                  </Card>
                </div>
              )}
            </div>
          )}

          {tab === 'drivers' && (

              <Hr/>

                <div>
                  <table style={{width:'100%', borderCollapse:'collapse'}}>

                      <th style={{textAlign:'right', fontSize:11, textTransform:'uppercase', padding:'6px 4px'}}>Var. interanual</th>
                    </tr></thead>
                    <tbody>
                      {DRIVERS_RAW.map(d => (
                        <tr key={d.id} onClick={() => setSelectedDriverId(d.id)} style={{cursor:'pointer', background: d.id===selectedDriverId?ACCENT_100:'transparent', borderBottom:`1px solid ${DIVIDER}`}}>
                          <td style={{padding:'10px 4px', fontSize:13.5}}>{d.name}</td>
                          <td style={{padding:'10px 4px'}}>{tag(d.confidence, d.confidence==='Alta'?'accent':d.confidence==='Media'?'outline':'neutral')}</td>
                          <td style={{padding:'10px 4px', textAlign:'right', fontWeight:800, color:driverColor(d.yoy)}}>{fmtPct(d.yoy)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <h6 style={{marginTop:24, color:N600, fontSize:13}}>Cobertura en construcción</h6>
                  <div style={{display:'flex', flexWrap:'wrap', gap:8, marginTop:8}}>
                    {LIMITED_DRIVERS.map(ld => <span key={ld}>{tag(ld,'neutral')}</span>)}
                  </div>
                </div>
                <Card>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                    <div>
                      <div style={{fontSize:19, fontWeight:800}}>{selectedDriverRaw.name}</div>
                      <div style={{fontSize:12, color:N600, marginTop:4}}>Fuente: {selectedDriverRaw.fuente} · Confianza {selectedDriverRaw.confidence}</div>
                    </div>
                    {tag(fmtPct(selectedDriverRaw.yoy), driverTagKind(selectedDriverRaw.yoy))}
                  </div>
                  <svg width="100%" height="34" viewBox="0 0 100 34" preserveAspectRatio="none" style={{marginTop:12, display:'block'}}>
                    <polyline points={selectedDriverRaw.spark} fill="none" stroke={driverColor(selectedDriverRaw.yoy)} strokeWidth="2"></polyline>
                  </svg>
                  <h3 style={{marginTop:12, fontSize:20}}>{selectedDriverRaw.current.toLocaleString('es-ES')} {selectedDriverRaw.unit}</h3>
                  <p style={{fontSize:13.5, lineHeight:1.5, marginTop:8}}>{selectedDriverRaw.desc}</p>
                  <div style={{fontSize:12, color:N600}}>Afecta a: {selectedDriverRaw.sectors.map(id => SECTORS_RAW[id].name).join(', ')}</div>
                  {effSector.driversIds.includes(selectedDriverRaw.id) && (
                    <Btn kind="primary" style={{marginTop:12}} onClick={() => { setTab('simulator'); setSimSectorId(effSector.id); setSimDriverId(selectedDriverRaw.id); setSimPeso(null); setSimVariacion(null); }}>Simular impacto en mi margen →</Btn>
                  )}
                </Card>
              </div>
            </div>
          )}

          {tab === 'sectors' && (
            <div>
              <Kicker>Sector Intelligence</Kicker>
              <h2 style={{marginTop:6}}>Tu vertical, visto a través de todos los drivers</h2>
              <Hr/>
              <div style={{display:'flex', gap:8, flexWrap:'wrap', marginBottom:24}}>
                {sectorTiles.map(sec => (
                  <Btn key={sec.id} kind={selectedSectorId===sec.id?'primary':'secondary'} disabled={sec.locked} onClick={() => !sec.locked && setSelectedSectorId(sec.id)}>{sec.name}</Btn>
                ))}
              </div>
              {sectorLocked ? (
                <div style={{border:`2px dashed ${DIVIDER}`, padding:32, textAlign:'center'}}>
                  <h4>Este sector aún no tiene datos verificados</h4>
                  <p style={{maxWidth:'44ch', margin:'8px auto 0', color:N600}}>Kairos solo muestra información con fuente y confianza declaradas. Este vertical entra en Fase 2 del roadmap de cobertura.</p>
                </div>
              ) : (
                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:24, alignItems:'start'}}>
                  <div>
                    <h6 style={{fontSize:13}}>Estructura de coste promedio</h6>
                    <Card style={{marginTop:8}}>
                      <div style={{display:'flex', height:8, gap:1}}>
                        {sectorDetail.estructura.map(([label,pct,color],i) => <div key={i} style={{width:pct+'%', background:color}}/>)}
                      </div>
                      <div style={{display:'flex', flexWrap:'wrap', gap:16, marginTop:12}}>
                        {sectorDetail.estructura.map(([label,pct,color],i) => (
                          <div key={i} style={{display:'flex', alignItems:'center', gap:6, fontSize:12}}>
                            <span style={{width:9,height:9,background:color,display:'inline-block'}}/>{label}<span style={{color:N600}}>{pct}%</span>
                          </div>
                        ))}
                      </div>
                      <div style={{fontSize:11, color:N600, marginTop:12}}>Empresa tipo del sector · Fuente: Banco de España — Central de Balances</div>
                    </Card>
                    <h6 style={{marginTop:24, fontSize:13}}>Drivers relevantes</h6>
                    <div style={{display:'flex', flexWrap:'wrap', gap:8, marginTop:8}}>
                      {sectorDetail.driverChips.map(d => (
                        <span key={d.id} onClick={() => { setTab('drivers'); setSelectedDriverId(d.id); }}>{tag(`${d.name} ${fmtPct(d.yoy)}`, 'outline', {cursor:'pointer'})}</span>

                  <div>
                    <h6 style={{fontSize:13}}>Riesgos</h6>

                    <h6 style={{marginTop:16, fontSize:13}}>Oportunidades</h6>
                    {sectorDetail.oportunidades.map((o,i) => <Card key={i} tint style={{marginTop:8}}><p style={{fontSize:13.5, lineHeight:1.5, margin:0}}>{o}</p></Card>)}
                  </div>
                </div>

            </div>
          )}

          {tab === 'simulator' && (
            <div>
              <Kicker>Impact Simulator</Kicker>
              <h2 style={{marginTop:6}}>Si esto se mueve, ¿qué pasa con mi margen?</h2>
              <p style={{color:N600, fontSize:14}}>Empresa tipo de {simSector.name} · ajusta el peso del driver y la variación esperada</p>

              {hasProfile && (
                <Card style={{display:'flex', flexDirection:'row', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', marginTop:12}}>
                  <div style={{display:'flex', gap:24, flexWrap:'wrap'}}>
                    <div><div style={{fontSize:11, color:N600}}>Tu empresa — sector</div><div style={{fontWeight:800}}>{profileCard.sector}</div></div>
                    <div><div style={{fontSize:11, color:N600}}>Facturación</div><div style={{fontWeight:800}}>{profileCard.revenue}</div></div>
                    <div><div style={{fontSize:11, color:N600}}>Empleados</div><div style={{fontWeight:800}}>{profileCard.headcount}</div></div>
                  </div>
                  <Btn kind="ghost" onClick={editProfile}>Editar →</Btn>
                </Card>
              )}
              <Hr/>

              <h6 style={{fontSize:14}}>1. Elige el insumo a modelar y su peso en tu coste</h6>
              <p style={{color:N600, maxWidth:'70ch', fontSize:13.5}}>Cuando una partida agrupa varios insumos (p. ej. Materia prima en alimentación), marca abajo cuáles son realmente relevantes para tu negocio — el modelo dejará de promediar insumos que no te afectan.</p>
              <div style={{display:'flex', gap:8, flexWrap:'wrap', margin:'8px 0 16px'}}>
                {simDriverIds.map(id => { const d = DRIVERS_RAW.find(x=>x.id===id);
                  const lineIdx = Object.keys(estructuraMap).find(k => (estructuraMap[k]||[]).includes(id));
                  const lineKey = lineIdx != null ? simSectorId+'_'+lineIdx : null;
                  return <Btn key={id} kind={id===activeSimDriverId?'primary':'secondary'} onClick={() => { const next={...estrVars}; if(lineKey) delete next[lineKey]; setEstrVars(next); setSimDriverId(id); setSimPeso(null); setSimVariacion(null); }}>{d.name}</Btn>;
                })}
              </div>

              <Card>
                <div style={{fontSize:13}}>Peso del insumo en tu estructura de coste: <b>{peso}%</b></div>
                <input type="range" min="0" max="60" value={peso} onChange={e => setSimPeso(Number(e.target.value))} style={{width:'100%'}}/>
                <div style={{fontSize:13, marginTop:8}}>Variación de precio esperada: <b>{fmtPct(variacion)}</b></div>
                <input type="range" min="-30" max="60" value={variacion} onChange={e => setSimVariacion(Number(e.target.value))} style={{width:'100%'}}/>
                <p style={{fontSize:11.5, color:N600, marginTop:8}}>Modelo simplificado de traspaso directo a coste, sin ajuste de sustitución ni repercusión a precio de venta. Los resultados se reflejan abajo, en tu estructura completa. Base: estructura de coste promedio del sector, Banco de España — Central de Balances.</p>
              </Card>

              <h6 style={{marginTop:32, fontSize:14}}>2. Presión macro general</h6>
              <p style={{color:N600, maxWidth:'70ch', fontSize:13.5}}>La inflación no es un insumo de tu coste: tensiona toda la estructura a la vez. Los tipos de interés tampoco son coste operativo — encarecen tu financiación, no tu margen. Por eso van aparte.</p>
              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginTop:12}}>
                <Card>
                  <div style={{fontSize:13}}>Inflación general esperada (IPC): <b>{fmtPct(currentInflGeneral)}</b></div>
                  <input type="range" min="-5" max="10" step="0.1" value={currentInflGeneral} onChange={e => setInflGeneral(Number(e.target.value))} style={{width:'100%'}}/>
                  <p style={{fontSize:11.5, color:N600, marginTop:8}}>Se aplica como una presión uniforme sobre el 100% de tu estructura de coste, no sobre una partida concreta.</p>
                </Card>
                <Card>
                  <div style={{fontSize:13}}>Tipos de interés (BCE): <b>{tiposLabel}</b></div>
                  <p style={{fontSize:13.5, marginTop:8}}>No se simula aquí: no afecta tu margen operativo, sino tu coste financiero (intereses de deuda). Consulta su efecto en Drivers y Decision Center.</p>
                </Card>
              </div>

              <h6 style={{marginTop:32, fontSize:14}}>3. Tu estructura completa, con todo aplicado</h6>
              <p style={{color:N600, maxWidth:'70ch', fontSize:13.5}}>Este es el único resultado de margen y EBITDA de la plataforma — combina el insumo que estás modelando, la presión macro general y el resto de partidas.</p>
              <Card style={{marginTop:12}}>
                <div style={{display:'flex', flexDirection:'column', gap:16}}>
                  {estructuraSim.map(p => (
                    <div key={p.key}>
                      <div style={{display:'grid', gridTemplateColumns:'170px 1fr 90px 90px', gap:12, alignItems:'center'}}>
                        <div style={{display:'flex', alignItems:'center', gap:8, fontSize:12.5}}>
                          <span style={{width:9,height:9,background:p.color,flexShrink:0,display:'inline-block'}}/>{p.label}
                          <span style={{color:N600, fontSize:10.5}}>({p.pct}%)</span>
                        </div>
                        <input type="range" min="-30" max="60" value={p.v}
                          onChange={e => p.isActiveLine ? setSimVariacion(Number(e.target.value)) : setEstrVars({...estrVars, [p.key]: Number(e.target.value)})} style={{width:'100%'}}/>
                        <div style={{fontSize:12.5, textAlign:'right', fontWeight:600}}>{fmtPct(p.v)}</div>
                        <div style={{fontSize:11.5, textAlign:'right', color: p.contribPP>0.05?ACCENT_700:(p.contribPP<-0.05?TEXT:N600)}}>{(p.contribPP>=0?'+':'')+p.contribPP.toFixed(1)+' pp'}</div>
                      </div>
                      {p.hasInsumoPicker && (
                        <div style={{display:'flex', gap:6, flexWrap:'wrap', margin:'6px 0 0 18px'}}>
                          {p.linkedIds.map(id => { const d = DRIVERS_RAW.find(x=>x.id===id); const checked = p.selectedIds.includes(id);
                            return <span key={id} onClick={() => { const next = checked ? p.selectedIds.filter(x=>x!==id) : [...p.selectedIds, id]; setRelevantInsumos({...relevantInsumos, [p.key]: next}); }}>
                              {tag(`${d.name} ${fmtPct(d.yoy)}`, checked?'accent':'outline', {cursor:'pointer', fontSize:10.5})}
                            </span>; })}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
                <Hr/>
                <div style={{display:'flex', alignItems:'baseline', gap:16, flexWrap:'wrap'}}>
                  <div><div style={{fontSize:11, color:N600}}>Margen actual</div><h3 style={{marginTop:4}}>{margenActual.toFixed(1)}%</h3></div>
                  <span style={{color:N600}}>→</span>
                  <div><div style={{fontSize:11, color:N600}}>Margen combinado proyectado</div><h3 style={{marginTop:4, color:deltaCombColor}}>{margenCombinado.toFixed(1)}%</h3></div>
                  <span style={{marginLeft:'auto'}}>{tag((deltaComb>=0?'+':'')+deltaComb.toFixed(1)+' pp', deltaComb<-0.05?'accent':deltaComb>0.05?'neutral':'outline')}</span>
                </div>
                {hasProfile && <p style={{fontSize:13.5, marginTop:8}}>≈ <b>{ebitdaCombImpactLabel}</b> de EBITDA anual combinado — estimación modelada sobre tu segmento.</p>}
                <p style={{fontSize:13.5}}>{simCombNarrativa}</p>
              </Card>
            </div>
          )}

          {tab === 'decisions' && (
            <div>
              <Kicker>Decision Center</Kicker>
              <h2 style={{marginTop:6}}>Máximo tres prioridades. Nunca una orden.</h2>
              <Hr/>
              <div style={{display:'flex', flexDirection:'column', gap:12}}>
                {decisionsForSector.map((dec,i) => (
                  <Card key={i}>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:16, flexWrap:'wrap'}}>
                      <div style={{fontWeight:800, fontSize:15, maxWidth:'44ch'}}>{dec.title}</div>
                      <div style={{display:'flex', gap:6, flexShrink:0}}>
                        {tag(`Impacto: ${dec.impact}`,'neutral')}{tag(`Urgencia: ${dec.urgency}`,'neutral')}{tag(`Confianza: ${dec.confidence}`, dec.confidence==='Alta'?'accent':dec.confidence==='Media'?'outline':'neutral')}
                      </div>
                    </div>
                    <p style={{fontSize:13.5, lineHeight:1.5}}>{dec.body}</p>
                  </Card>
                ))}
              </div>
            </div>
          )}

          {tab === 'opportunities' && (
            <div>
              <Kicker>Opportunities</Kicker>
              <h2 style={{marginTop:6}}>No todo lo que cambia es una amenaza</h2>
              <Hr/>
              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16}}>
                {OPPORTUNITIES[effSector.id].map((op,i) => (
                  <Card key={i} tint>
                    <div style={{fontWeight:800, fontSize:15}}>{op.title}</div>
                    <p style={{fontSize:13.5, lineHeight:1.5}}>{op.body}</p>
                    <div style={{fontSize:11, color:N600}}>Confianza {op.confidence} · Fuente: {op.fuente}</div>
                  </Card>
                ))}
              </div>
            </div>
          )}
        </div>

        {copilotOpen && (
          <div style={{width:340, flexShrink:0, borderLeft:`2px solid ${TEXT}`, background:SURFACE, display:'flex', flexDirection:'column', padding:16}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <div style={{display:'flex', alignItems:'center', gap:8}}>
                <span style={{width:7,height:7,borderRadius:'50%',background:ACCENT,display:'inline-block',animation:'krs-pulse 2s ease-in-out infinite'}}/>
                <h4>Brandt AI</h4>
              </div>
              <span onClick={() => setCopilotOpen(false)} style={{cursor:'pointer', fontSize:18, lineHeight:1, padding:4}}>×</span>
            </div>
            <p style={{fontSize:12, color:N600, marginTop:6}}>Piensa como tu director de estrategia. No es un chatbot genérico — prueba una de estas preguntas.</p>
            <div style={{flex:1, overflowY:'auto', marginTop:12, display:'flex', flexDirection:'column', gap:8}}>
              {copilotThread.map((m,i) => (
                <div key={i} style={{alignSelf: m.role==='user'?'flex-end':'flex-start', maxWidth:'88%', background: m.role==='user'?ACCENT_100:'#fff', border:`1px solid ${DIVIDER}`, padding:'10px 13px', fontSize:12.5, lineHeight:1.55}}>{m.text}</div>
              ))}
            </div>
            <div style={{marginTop:12, display:'flex', flexDirection:'column', gap:6}}>
              {copilotPrompts.map((p,i) => <Btn key={i} kind="secondary" onClick={p.a} style={{width:'100%'}}>{p.label}</Btn>)}
            </div>
            <p style={{fontSize:11, color:N600, marginTop:12, borderTop:`1px solid ${DIVIDER}`, paddingTop:8}}>Beta · respuestas guionizadas para esta demo. La entrada libre llega en la Fase 4 del roadmap.</p>
          </div>
        )}
      </div>

      <div style={{borderTop:`2px solid ${TEXT}`, background:SURFACE}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 24px', cursor:'pointer'}} onClick={() => setFeedOpen(!feedOpen)}>
          <h6 style={{color:N600, fontSize:13}}>Live Feed · señales recientes</h6>
          <span style={{fontSize:11, color:N600}}>{feedOpen?'Ocultar ▲':'Mostrar ▼'}</span>
        </div>
        {feedOpen && (
          <div style={{display:'flex', overflowX:'auto', padding:'0 24px 12px'}}>
            {feedItems.map(f => (
              <div key={f.i} onClick={() => setFeedExpanded(feedExpanded===f.i?null:f.i)} style={{minWidth:220, flexShrink:0, padding:'10px 16px 10px 0', borderRight:`1px solid ${DIVIDER}`, marginRight:16, cursor:'pointer'}}>
                <div style={{display:'flex', justifyContent:'space-between', gap:10}}>
                  <span style={{fontSize:9.5, color:N500}}>{f.time}</span>
                  <span style={{fontSize:9.5, color:ACCENT_700}}>{f.fuente}</span>
                </div>
                <div style={{fontSize:12, marginTop:4, lineHeight:1.4}}>{f.text}</div>
                {feedExpanded===f.i && <div style={{fontSize:11, color:N600, marginTop:6, lineHeight:1.5, borderLeft:`2px solid ${ACCENT}`, paddingLeft:8}}>{f.detalle}</div>}
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{textAlign:'center', padding:'14px 24px', borderTop:`1px solid ${DIVIDER}`, fontSize:11.5, color:N600}}>
        <a href="index.html" style={{color:N600}}>Inicio DBCG</a> · <a href="index.html#trabajo" style={{color:N600}}>Cómo trabajo</a> · <a href="index.html#trayectoria" style={{color:N600}}>Trayectoria</a> · <a href="aviso-legal.html" style={{color:N600}}>Aviso legal</a> · <a href="politica-privacidad.html" style={{color:N600}}>Privacidad</a>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
