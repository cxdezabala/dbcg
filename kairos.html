function fmtPct(n) { const s = Math.abs(n).toFixed(1).replace('.', ','); return (n > 0 ? '+' : n < 0 ? '−' : '') + s + '%'; }
function fmtEur(n) { return '€' + n.toLocaleString('es-ES', { maximumFractionDigits: 0 }); }
function driverColor(yoy) { return Math.abs(yoy) >= 5 ? ACCENT_700 : (Math.abs(yoy) >= 1 ? TEXT : N600); }
function driverTagKind(yoy) { return Math.abs(yoy) >= 5 ? 'accent' : (Math.abs(yoy) >= 1 ? 'outline' : 'neutral'); }
function timeAgo(iso) {
  if (!iso) return null;
  const diffMs = Date.now() - new Date(iso).getTime();
  if (!Number.isFinite(diffMs) || diffMs < 0) return null;
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return 'hace un momento';
  if (min < 60) return `hace ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `hace ${h} h`;
  const d = Math.floor(h / 24);
  return `hace ${d} día${d === 1 ? '' : 's'}`;
}
function fmtUpdatedAt(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return null;
  const fecha = d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }).replace(/\.(?=\s|$)/g, '');
  const hora = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  return `${fecha}, ${hora}`;
}

  const sizeRank = profile ? Math.round(((REVENUE_BANDS.findIndex(b => b.id === profile.revenueBandId)) + (HEADCOUNT_BANDS.findIndex(b => b.id === profile.headcountBandId))) / 2) : 2;
  const sizeAdj = SIZE_ADJUST[sizeRank];

  // Entre los drivers en vivo (refrescados a diario) se prioriza siempre el de mayor
  // variación — solo si ninguno del sector está conectado todavía a una fuente en vivo
  // se recurre a los de fallback, para no mostrar como "noticia de hoy" un dato
  // congelado desde hace semanas (ver api/_lib/sources.js para la lista de conectados).
  const sectorDrivers = DRIVERS_RAW.filter(d => effSector.driversIds.includes(d.id));
  const liveSectorDrivers = sectorDrivers.filter(d => liveDriverIds.includes(d.id));
  const topDriver = (liveSectorDrivers.length > 0 ? liveSectorDrivers : sectorDrivers).sort((a,b) => Math.abs(b.yoy) - Math.abs(a.yoy))[0];
  const brief = {
    changed: `${topDriver.name} se ha movido ${fmtPct(topDriver.yoy)} interanual, la variación más marcada entre los drivers de tu sector.`,
    matters: `Representa cerca de un ${effSector.pesoPorDriver[topDriver.id] || 0}% de tu estructura de coste — un movimiento sostenido en esta magnitud presiona el margen de la empresa tipo del sector.`,
    consider: `Revisa el Impact Simulator para cuantificar el efecto en tu margen y valora la prioridad correspondiente en el Decision Center.`,
  };
  const decisionsForSector = DECISIONS[effSector.id];
  const topDecisionTitle = decisionsForSector[0].title;
  const causalityChain = [ topDriver.name, 'Costes operativos', 'EBITDA', 'Cash flow', 'Libertad estratégica' ];

  const selectedDriverRaw = DRIVERS_RAW.find(d => d.id === selectedDriverId) || DEMAND_SIGNALS.find(d => d.id === selectedDriverId) || DRIVERS_RAW[0];
  const driverHistory = DRIVERS_HISTORY[selectedDriverRaw.id] || [];
  const driverProj = PROJECTIONS[selectedDriverRaw.id] || null;
  const projPoint = driverProj ? driverProj.h[projHorizon] : null;
  const projChart = (() => {
    if (!driverHistory.length) return null;
    const cur = selectedDriverRaw.current;
    const hist = driverHistory.map(h => h.value);
    const pv = projPoint ? cur * (1 + projPoint.v / 100) : null;
    const plo = projPoint ? cur * (1 + projPoint.lo / 100) : null;
    const phi = projPoint ? cur * (1 + projPoint.hi / 100) : null;
    const all = [...hist, cur].concat(projPoint ? [plo, phi, pv] : []);
    const min = Math.min(...all), max = Math.max(...all);
    const span = (max - min) || 1;
    const H = 46, PAD = 4;
    const y = v => PAD + (1 - (v - min) / span) * (H - PAD * 2);
    const HX = projPoint ? 64 : 100;
    const pts = (hist.length && hist[hist.length - 1] === cur) ? hist : [...hist, cur];
    const histPts = pts.map((v, i) => `${(i / (pts.length - 1)) * HX},${y(v).toFixed(2)}`).join(' ');
    if (!projPoint) return { H, HX, histPts, band:null, projPts:null, projY:null };
    const band = `${HX},${y(cur).toFixed(2)} 100,${y(phi).toFixed(2)} 100,${y(plo).toFixed(2)}`;
    return { H, HX, histPts, band, projPts:`${HX},${y(cur).toFixed(2)} 100,${y(pv).toFixed(2)}`, projY:y(pv) };
  })();
  const historyMin = driverHistory.length ? Math.min(...driverHistory.map(h => h.value)) : 0;
  const historyMax = driverHistory.length ? Math.max(...driverHistory.map(h => h.value)) : 0;

  const sectorTiles = SECTOR_TILE_ORDER.map(key => {
    const sec = SECTORS_RAW[key];
    return sec ? { ...sec, locked: LOCKED_SECTORS.includes(key) } : { id:key, name:key, locked:true };
  });
  const sectorLocked = LOCKED_SECTORS.includes(selectedSectorId);
  const ESTRUCTURA_COLORS = [N300, ACCENT, N400, N600, N800];
  let sectorDetail = { estructura: [], driverChips: [], riesgos: [], oportunidades: [], fuenteEstructura: null };
  if (!sectorLocked) {
    const sec = SECTORS_RAW[selectedSectorId];
    const liveEstructura = costStructuresLive[selectedSectorId];
    const estructuraBase = liveEstructura
      ? liveEstructura.estructura.map(([label, pct], i) => [label, pct, ESTRUCTURA_COLORS[i % ESTRUCTURA_COLORS.length]])
      : sec.estructura;
    const personalIdx = estructuraBase.findIndex(([label]) => label.includes('Personal'));
    const otrosIdx = estructuraBase.length - 1;
    let estructuraAdj = estructuraBase;
    if (profile && personalIdx !== -1 && personalIdx !== otrosIdx) {
      estructuraAdj = estructuraBase.map((line, i) => {
        if (i === personalIdx) return [line[0], Math.max(2, Math.round((line[1] + sizeAdj.personalDelta) * 10) / 10), line[2]];
        if (i === otrosIdx) return [line[0], Math.max(2, Math.round((line[1] - sizeAdj.personalDelta) * 10) / 10), line[2]];
        return line;
      });
    }
    sectorDetail = { estructura: estructuraAdj, riesgos: sec.riesgos, oportunidades: sec.oportunidades,
      driverChips: sec.driversIds.map(id => DRIVERS_RAW.find(x => x.id === id)),
      fuenteEstructura: liveEstructura ? `${liveEstructura.fuente} (${liveEstructura.asOf}) · ${liveEstructura.metodo}` : null };
  }

  const simSector = SECTORS_RAW[simSectorId] || effSector;
  const structureLinkedIds = new Set(Object.values(simSector.estructuraDriverMap || {}).flat());
  const simDriverIds = simSector.driversIds.filter(id => structureLinkedIds.has(id));
  const activeSimDriverId = simDriverIds.includes(simDriverId) ? simDriverId : simDriverIds[0];
  const simDriverRaw = DRIVERS_RAW.find(d => d.id === activeSimDriverId);
  const pesoDefault = simSector.pesoPorDriver[activeSimDriverId] || 10;
  const peso = simPeso ?? pesoDefault;
  const variacion = simVariacion ?? Math.round(simDriverRaw.yoy);
  const margenActual = simSector.margenBase + (profile ? sizeAdj.margenDelta : 0);
  const costeActual = 100 - margenActual;
  const costeNuevo = costeActual * (1 + (peso / 100) * (variacion / 100));
  const margenNuevo = 100 - costeNuevo;
  const delta = margenNuevo - margenActual;
  const deltaColor = delta < -0.05 ? ACCENT_700 : (delta > 0.05 ? TEXT : N600);
  let simNarrativa;
  if (delta < -0.05) simNarrativa = `Si ${simDriverRaw.name.toLowerCase()} varía un ${fmtPct(variacion)} y pesa un ${peso}% de tu coste, tu margen bajaría de ${margenActual.toFixed(1)}% a ${margenNuevo.toFixed(1)}% — ${Math.abs(delta).toFixed(1)} puntos porcentuales que conviene anticipar.`;
  else if (delta > 0.05) simNarrativa = `Con esta variación, tu margen mejoraría de ${margenActual.toFixed(1)}% a ${margenNuevo.toFixed(1)}%, ganando ${delta.toFixed(1)} puntos porcentuales.`;
  else simNarrativa = 'Con estos parámetros el impacto sobre el margen es prácticamente neutro.';
  const hasProfile = !!profile;

  const isProjMode = simMode !== 'actual';
  const projFallbacks = [];
  const varForDriver = (id) => {
    const raw = DRIVERS_RAW.find(d => d.id === id);
    if (!raw) return 0;
    if (!isProjMode) return raw.yoy;
    const p = PROJECTIONS[id] && PROJECTIONS[id].h[simMode];
    if (p) return p.v;
    if (!projFallbacks.includes(raw.name)) projFallbacks.push(raw.name);
    return raw.yoy;
  };
  const margenBaseComb = simSector.margenBase + (profile ? sizeAdj.margenDelta : 0);
  const costeActualComb = 100 - margenBaseComb;
  let costeCombinadoNuevo = 0;
  let costeSinDriver = 0;
  const estructuraMap = simSector.estructuraDriverMap || {};
  const estructuraSim = simSector.estructura.map(([label, pctBase, color], idx) => {
    const key = simSectorId + '_' + idx;
    const linkedIds = estructuraMap[idx] || [];
    const isActiveLine = linkedIds.includes(activeSimDriverId);
    const hasInsumoPicker = linkedIds.length > 1;
    const pct = (isActiveLine && !hasInsumoPicker) ? peso : pctBase;
    const defaultSelected = linkedIds.includes(activeSimDriverId) ? [activeSimDriverId] : (linkedIds.length ? [linkedIds[0]] : []);
    const selectedIds = relevantInsumos[key] || defaultSelected;
    let defaultVar = 0;
    if (selectedIds.length) {
      const weighted = selectedIds.map(id => ({ w: id === activeSimDriverId ? peso : (simSector.pesoPorDriver[id] || 1), val: (id === activeSimDriverId && !isProjMode) ? variacion : varForDriver(id) }));
      const totalW = weighted.reduce((a, x) => a + x.w, 0) || 1;
      defaultVar = weighted.reduce((a, x) => a + x.val * x.w, 0) / totalW;
    }
    const v = (isActiveLine || isProjMode) ? defaultVar : (estrVars[key] ?? defaultVar);
    const shareRevenue = costeActualComb * (pct / 100);
    const contribPP = shareRevenue * (v / 100);
    costeCombinadoNuevo += shareRevenue * (1 + v / 100);
    if (!selectedIds.length) costeSinDriver += shareRevenue;
    return { label, color, pct, v, contribPP, key, isActiveLine, hasInsumoPicker, linkedIds, selectedIds };
  });
  const inflRaw = DRIVERS_RAW.find(d => d.id === 'inflacion');
  const currentInflGeneral = isProjMode
    ? Number((inflRaw.current * (1 + (PROJECTIONS.inflacion.h[simMode] ? PROJECTIONS.inflacion.h[simMode].v / 100 : 0))).toFixed(1))
    : (inflGeneral ?? inflRaw.current);
  costeCombinadoNuevo += costeSinDriver * (currentInflGeneral / 100);
  const tiposLabel = fmtPct(DRIVERS_RAW.find(d => d.id === 'tipos').yoy);
  const margenCombinado = 100 - costeCombinadoNuevo;
  const deltaComb = margenCombinado - margenBaseComb;
  const deltaCombColor = deltaComb < -0.05 ? ACCENT_700 : (deltaComb > 0.05 ? TEXT : N600);
  let simCombNarrativa;
  if (deltaComb < -0.05) simCombNarrativa = `Sumando las variaciones fijadas en cada partida, el margen caería de ${margenBaseComb.toFixed(1)}% a ${margenCombinado.toFixed(1)}%, una pérdida combinada de ${Math.abs(deltaComb).toFixed(1)} puntos porcentuales.`;
  else if (deltaComb > 0.05) simCombNarrativa = `Con estas variaciones combinadas, el margen mejoraría de ${margenBaseComb.toFixed(1)}% a ${margenCombinado.toFixed(1)}%, ganando ${deltaComb.toFixed(1)} puntos porcentuales.`;
  else simCombNarrativa = 'Con los valores actuales de cada partida, el efecto combinado sobre el margen es prácticamente neutro.';
  let ebitdaCombImpactLabel = '';
  if (hasProfile) { const band = REVENUE_BANDS.find(b => b.id === profile.revenueBandId); ebitdaCombImpactLabel = fmtEur(Math.round(band.mid * 1000000 * (deltaComb / 100))); }

  // Snapshot de la sesión que se envía al modelo como contexto: perfil, drivers,
  // estructura de coste y el resultado del simulador tal y como los ve el usuario ahora.
  const kairosContext = {
    fecha_datos: fmtUpdatedAt(driversUpdatedAt) || DATA_SNAPSHOT,
    perfil: hasProfile ? {
      sector: simSector.name,
      facturacion_tramo: REVENUE_BANDS.find(b => b.id === profile.revenueBandId).label,
      empleados_tramo: HEADCOUNT_BANDS.find(b => b.id === profile.headcountBandId).label,
    } : null,
    escenario: isProjMode ? `proyección a ${HORIZONS.find(h => h.id === simMode).label}` : 'último dato publicado',
    drivers: DRIVERS_RAW.map(d => {
      const p = PROJECTIONS[d.id];
      const ph = p && p.h[simMode];
      return {
        nombre: d.name, valor_actual: `${d.current} ${d.unit}`, variacion_interanual_pct: d.yoy,
        fuente: d.fuente, confianza: d.confidence,
        proyeccion: ph ? { horizonte: simMode, variacion_pct: ph.v, rango: [ph.lo, ph.hi], metodo: p.metodo, fuente: p.fuente } : null,
      };
    }),
    estructura_coste: estructuraSim.map(p => ({ partida: p.label, pct_sobre_coste: p.pct, variacion_aplicada_pct: Number(p.v.toFixed(1)), contribucion_pp: Number(p.contribPP.toFixed(2)) })),
    inflacion_general_pct: currentInflGeneral,
    resultado_simulador: {
      margen_base_pct: Number(margenBaseComb.toFixed(1)),
      margen_proyectado_pct: Number(margenCombinado.toFixed(1)),
      delta_pp: Number(deltaComb.toFixed(1)),
      impacto_ebitda_eur: hasProfile ? ebitdaCombImpactLabel : null,
      nota: 'El impacto en euros usa el punto medio del tramo de facturación, no la cifra real de la empresa.',
    },
    brief_hoy: brief,
    decision_prioritaria: topDecisionTitle,
    titulares_feed: DRIVERS_RAW.slice(0, 6).map(d => ({ titular: `${d.name} ${fmtPct(d.yoy)}`, texto: d.desc.split('. ')[0] + '.', fuente: d.fuente })),
    drivers_sin_proyeccion: projFallbacks,
  };

  const askCopilot = (userText, aiText) => setCopilotThread(t => [...t, { role:'user', text:userText }, { role:'ai', text:aiText }]);

  const sendToBrandt = async (question, fallback) => {
    if (!question.trim() || copilotBusy) return;
    const history = copilotThread.slice(-8).map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));
    setCopilotThread(t => [...t, { role:'user', text:question }]);
    setCopilotInput('');
    setCopilotBusy(true);
    try {
      const res = await fetch('/api/brandt', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ question, history, context: kairosContext }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data.answer) throw new Error('respuesta vacía');
      setCopilotThread(t => [...t, { role:'ai', text:data.answer }]);
    } catch (e) {
      setCopilotThread(t => [...t, { role:'ai', text: fallback || 'No he podido conectar con el motor de análisis ahora mismo. Vuelve a intentarlo en un momento — mientras, los números del panel y del simulador siguen siendo válidos.', offline:!fallback }]);
    } finally {
      setCopilotBusy(false);
    }
  };

  const copilotPrompts = [
    { label:'¿Qué ha cambiado hoy?', a:() => sendToBrandt('¿Qué ha cambiado hoy?', `${brief.changed} ¿Quieres que lo traduzca a un número de margen para tu negocio en el Simulador?`) },
    { label:'¿Debería subir precios ahora?', a:() => sendToBrandt('¿Debería subir precios ahora?', `Depende de cuánta demanda perderías. Con la presión actual de ${topDriver.name.toLowerCase()}, un traslado parcial de precio suele compensar sin dañar volumen. ¿Sabes qué elasticidad tiene tu producto principal?`) },
    { label:'Explica de dónde sale esta previsión', a:() => sendToBrandt('Explica de dónde sale esta previsión', `Uso la estructura de coste promedio del sector (Banco de España — Central de Balances) y la variación publicada por la fuente oficial del driver. No conozco tus cifras reales, así que todo esto es una estimación modelada, no un dato de tu empresa.`) },
    { label:'¿Qué prioridad debería mirar primero?', a:() => sendToBrandt('¿Qué prioridad debería mirar primero?', `Yo empezaría por "${topDecisionTitle}" — es la de mayor impacto y urgencia combinados ahora mismo. ¿Quieres que te explique el razonamiento completo?`) },
    { label:'¿Cómo negocio la tarifa eléctrica?', a:() => sendToBrandt('¿Cómo negocio la tarifa eléctrica?', `Tres pasos concretos: 1) pide oferta a al menos dos comercializadoras más antes de renovar, usando tu curva de consumo de los últimos 12 meses; 2) valora fijar precio a plazo si tu volumen es predecible, para eliminar volatilidad; 3) pregunta por descuento por compromiso de permanencia o por desplazar consumo a horas valle. ¿Quieres que lo lleve al Simulador para ver cuánto margen liberaría un 5-10% de ahorro en tarifa?`) },
  ];

  // "time" refleja si el dato viene del pipeline en vivo (tiempo real desde
  // el último refresh de /api/drivers) o sigue siendo el valor de referencia
  // hardcodeado (fase 2 sin implementar) — nunca se inventa una antigüedad.
  const feedItems = DRIVERS_RAW.slice(0, 6).map((d, i) => {
    const isLive = liveDriverIds.includes(d.id);
    return {
      time: isLive ? (timeAgo(driversUpdatedAt) || 'En vivo') : 'Dato de referencia',
      isLive, asOf: d.asOf,
      fuente: d.fuente, text: d.desc.split('. ')[0] + '.', headline: `${d.name} ${fmtPct(d.yoy)}`, detalle: d.desc, i,
    };
  });

  const tabs = [ ['brief','Executive Brief'], ['drivers','Drivers'], ['sectors','Sector Intelligence'], ['simulator','Impact Simulator'], ['decisions','Decision Center'], ['opportunities','Opportunities'] ];

  return (
    <div style={{minHeight:'100vh', display:'flex', flexDirection:'column'}}>
      <div style={{borderBottom:`2px solid ${DIVIDER}`, background:SURFACE, height:34, display:'flex', alignItems:'center', overflow:'hidden'}}>
        <div style={{display:'flex', whiteSpace:'nowrap', animation:'krs-scroll 46s linear infinite'}}>
          {tickerLoop.map((t,i) => (
            <span key={i} style={{display:'inline-flex', alignItems:'center', gap:7, padding:'0 18px', borderRight:`1px solid ${DIVIDER}`, fontSize:11, fontWeight:600}}>
              <span style={{color:N600}}>{t.name}</span>
              <span style={{fontWeight:800, color:t.color}}>{t.valueLabel}</span>
              <span style={{color:N500}}>{t.fuente}</span>
            </span>
          ))}
        </div>
      </div>

      <div className="nav" style={{padding:'12px 24px', flexWrap:'wrap', rowGap:10}}>
        <span style={{display:'flex', alignItems:'center', gap:8, marginRight:'auto'}}>
          <span className="nav-brand" style={{margin:0}}>KAIROS</span>
          <a href="index.html" style={{textDecoration:'none'}}>{tag('by DBCG','outline')}</a>
        </span>
        <span style={{display:'flex', alignItems:'center', gap:16, flexWrap:'wrap'}}>
          {tabs.map(([id,label]) => (
            <span key={id} onClick={() => setTab(id)} style={{cursor:'pointer', fontSize:14, fontWeight: tab===id?700:400, color: tab===id?ACCENT_700:TEXT}}>{label}</span>
          ))}
        </span>
        <span style={{display:'flex', alignItems:'center', gap:12, marginLeft:'auto'}}>
          <span style={{fontSize:11, whiteSpace:'nowrap', color:N600}}>{profileSummary}</span>
          <Btn kind={copilotOpen?'primary':'secondary'} onClick={() => setCopilotOpen(!copilotOpen)} style={{whiteSpace:'nowrap', display:'flex', alignItems:'center', gap:8}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:'currentColor',display:'inline-block',animation:'krs-pulse 2s ease-in-out infinite'}}></span>Brandt AI
          </Btn>
        </span>
      </div>

      <div style={{flex:1, display:'flex', minHeight:0}}>
        <div style={{flex:1, minWidth:0, padding:'32px 24px', maxWidth:1200, margin:'0 auto', width:'100%', boxSizing:'border-box'}}>

          {showOnboarding && (
            <Card tint style={{marginBottom:32}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:16, flexWrap:'wrap'}}>
                <div>
                  <Kicker>Personaliza tu Kairos — 20 segundos</Kicker>
                  <h3 style={{marginTop:6, maxWidth:'50ch'}}>Dinos tu sector y tamaño para traducir las cifras de mercado a tu margen, no al promedio genérico.</h3>
                </div>
                <Btn kind="ghost" onClick={() => setOnboardingDismissed(true)}>Usar promedios de sector →</Btn>
              </div>
              <div style={{marginTop:16}}>
                <div style={{fontSize:12, fontWeight:700, marginBottom:8}}>Sector</div>
                <select value={onboardSector || ''} onChange={e => setOnboardSector(e.target.value)} style={{width:'100%', maxWidth:420, padding:'10px 12px', fontSize:14, fontFamily:'inherit', background:BG, border:`1px solid ${DIVIDER}`, color:TEXT}}>
                  <option value="" disabled>Elige tu sector…</option>
                  {Object.values(SECTORS_RAW).filter(sec => !LOCKED_SECTORS.includes(sec.id)).map(sec => <option key={sec.id} value={sec.id}>{sec.name}</option>)}
                </select>
              </div>
              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:24, marginTop:20, alignItems:'start'}}>
                <div>
                  <div style={{fontSize:12, fontWeight:700, marginBottom:8}}>Facturación anual</div>
                  <div className="seg">
                    {REVENUE_BANDS.map(b => (
                      <label key={b.id} className="seg-opt">
                        <input type="radio" name="onbRevenue" checked={onboardRevenue===b.id} onChange={() => setOnboardRevenue(b.id)}/>{b.label}
                      </label>
                    ))}
                  </div>
                </div>
                <div>
                  <div style={{fontSize:12, fontWeight:700, marginBottom:8}}>Empleados</div>
                  <div className="seg">
                    {HEADCOUNT_BANDS.map(b => (
                      <label key={b.id} className="seg-opt">
                        <input type="radio" name="onbHeadcount" checked={onboardHeadcount===b.id} onChange={() => setOnboardHeadcount(b.id)}/>{b.label}
                      </label>
                    ))}
                  </div>
                </div>
              </div>
              <Btn kind="primary" disabled={!canConfirmProfile} onClick={confirmProfile} style={{marginTop:24}}>Aplicar a mi Kairos →</Btn>
            </Card>
          )}

          {tab === 'brief' && (
            <div>
              <Kicker>Executive Brief · {effSector.name}</Kicker>
              <h2 style={{maxWidth:'32ch', marginTop:6}}>Esto es lo que necesitas saber antes de tu próxima decisión.</h2>
              <div style={{fontSize:12, color:N600, marginTop:6}}>Actualizado {fmtUpdatedAt(driversUpdatedAt) || DATA_SNAPSHOT} · Fuentes: INE · BCE · OMIE · CORES · MAPA · FEGA · LME · ICE</div>
              <Hr/>
              {!briefReady ? (
                <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:16}}>
                  {[0,1,2].map(i => <div key={i} style={{height:140, background:SURFACE, animation:'krs-shimmer 1.4s ease-in-out infinite'}}/>)}
                </div>
              ) : (
                <div>
                  <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:16}}>
                    <Card tint><Kicker>Qué cambió</Kicker><div style={{fontSize:15, fontWeight:600, marginTop:8}}>{brief.changed}</div></Card>
                    <Card><Kicker>Por qué importa</Kicker><div style={{fontSize:15, fontWeight:600, marginTop:8}}>{brief.matters}</div></Card>
                    <Card><Kicker>Qué considerar</Kicker><div style={{fontSize:15, fontWeight:600, marginTop:8}}>{brief.consider}</div></Card>
                  </div>
                  <Card style={{marginTop:16, flexDirection:'row', alignItems:'center', gap:20, flexWrap:'wrap'}}>
                    <div>
                      <div style={{fontSize:11, color:N600}}>{topDriver.name}</div>
                      <h1 style={{marginTop:2, color:driverColor(topDriver.yoy)}}>{fmtPct(topDriver.yoy)}</h1>
                    </div>
                    <div style={{color:N600, fontSize:12}}>interanual · fuente {topDriver.fuente} · confianza {topDriver.confidence}</div>
                    <Btn kind="ghost" style={{marginLeft:'auto'}} onClick={() => { setTab('drivers'); setSelectedDriverId(topDriver.id); }}>Ver detalle →</Btn>
                  </Card>
                  <h6 style={{marginTop:32, fontSize:14}}>Cadena de causalidad — {topDriver.name}</h6>
                  <div style={{display:'flex', alignItems:'center', gap:8, marginTop:12, flexWrap:'wrap'}}>
                    {causalityChain.map((c,i) => (
                      <span key={i} style={{display:'flex', alignItems:'center', gap:8}}>
                        {tag(c, i===0?'accent':'neutral', {fontSize:12.5, padding:'8px 14px'})}
                        {i < causalityChain.length-1 && <span style={{color:N600}}>→</span>}
                      </span>

                      {status!=='pendiente' && <React.Fragment>
                        {tag(status==='hecha'?'✓ Hecha':'Descartada', status==='hecha'?'accent':'neutral')}
                        <Btn kind="ghost" onClick={() => setDecisionStatus({...decisionStatus, [key]:'pendiente'})}>Reabrir</Btn>
                      </React.Fragment>}
                    </div>
                  </Card>
                );})}
              </div>
            </div>
          )}

          {tab === 'opportunities' && (
            <div>
              <Kicker>Opportunities</Kicker>
              <h2 style={{marginTop:6}}>No todo lo que cambia es una amenaza</h2>
              <Hr/>
              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16}}>
                {OPPORTUNITIES[effSector.id].map((op,i) => (
                  <Card key={i} tint>
                    <div style={{fontWeight:800, fontSize:15}}>{op.title}</div>
                    <p style={{fontSize:13.5, lineHeight:1.5}}>{op.body}</p>
                    <div style={{fontSize:11, color:N600}}>Confianza {op.confidence} · Fuente: {op.fuente}</div>
                  </Card>
                ))}
              </div>
            </div>
          )}
        </div>

        {copilotOpen && (
          <div style={{width:340, flexShrink:0, borderLeft:`2px solid ${TEXT}`, background:SURFACE, display:'flex', flexDirection:'column', padding:16}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <div style={{display:'flex', alignItems:'center', gap:8}}>
                <span style={{width:7,height:7,borderRadius:'50%',background:ACCENT,display:'inline-block',animation:'krs-pulse 2s ease-in-out infinite'}}/>
                <h4>Brandt AI</h4>
              </div>
              <span onClick={() => setCopilotOpen(false)} style={{cursor:'pointer', fontSize:18, lineHeight:1, padding:4}}>×</span>
            </div>
            <p style={{fontSize:12, color:N600, marginTop:6}}>Piensa como tu director de estrategia. Ve tu sector, tus drivers y el resultado de tu simulador — pregúntale lo que quieras.</p>
            <div style={{flex:1, overflowY:'auto', marginTop:12, display:'flex', flexDirection:'column', gap:8}}>
              {copilotThread.map((m,i) => (
                <div key={i} style={{alignSelf: m.role==='user'?'flex-end':'flex-start', maxWidth:'88%', background: m.role==='user'?ACCENT_100:'#fff', border:`1px solid ${m.offline?ACCENT:DIVIDER}`, padding:'10px 13px', fontSize:12.5, lineHeight:1.55, whiteSpace:'pre-wrap'}}>{m.text}</div>
              ))}
              {copilotBusy && (
                <div style={{alignSelf:'flex-start', background:'#fff', border:`1px solid ${DIVIDER}`, padding:'10px 13px', fontSize:12.5, color:N600, display:'flex', alignItems:'center', gap:8}}>
                  <span style={{width:7,height:7,borderRadius:'50%',background:ACCENT,display:'inline-block',animation:'krs-pulse 1.2s ease-in-out infinite'}}></span>Analizando tu contexto…
                </div>
              )}
            </div>
            <form onSubmit={e => { e.preventDefault(); sendToBrandt(copilotInput); }} style={{marginTop:12, display:'flex', gap:6}}>
              <input value={copilotInput} onChange={e => setCopilotInput(e.target.value)} disabled={copilotBusy}
                placeholder="Pregúntale sobre tus números…"
                style={{flex:1, minWidth:0, fontSize:12.5, fontFamily:'inherit', padding:'8px 10px', background:BG, border:`1px solid ${DIVIDER}`, color:TEXT, opacity:copilotBusy?0.6:1}}/>
              <Btn kind="primary" type="submit" disabled={copilotBusy || !copilotInput.trim()} style={{flexShrink:0}}>Enviar</Btn>
            </form>
            <div style={{marginTop:12, display:'flex', flexDirection:'column', gap:6}}>
              {copilotPrompts.map((p,i) => <Btn key={i} kind="secondary" onClick={p.a} disabled={copilotBusy} style={{width:'100%'}}>{p.label}</Btn>)}
            </div>
            <p style={{fontSize:11, color:N600, marginTop:12, borderTop:`1px solid ${DIVIDER}`, paddingTop:8}}>Beta · responde con los datos de esta sesión. Si el motor no está disponible, verás una respuesta de reserva.</p>
          </div>
        )}
      </div>

      <div style={{borderTop:`2px solid ${TEXT}`, background:SURFACE}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 24px', cursor:'pointer'}} onClick={() => setFeedOpen(!feedOpen)}>
          <div>
            <h6 style={{color:N600, fontSize:13, margin:0}}>Live Feed · el porqué detrás del número</h6>
            <div style={{fontSize:10.5, color:N500, marginTop:2}}>El ticker de arriba muestra el dato; esto explica qué significa — clic para el detalle completo</div>
          </div>
          <span style={{fontSize:11, color:N600, flexShrink:0}}>{feedOpen?'Ocultar ▲':'Mostrar ▼'}</span>
        </div>
        {feedOpen && (
          <div style={{display:'flex', overflowX:'auto', padding:'0 24px 12px'}}>
            {feedItems.map(f => (
              <div key={f.i} onClick={() => setFeedExpanded(feedExpanded===f.i?null:f.i)} style={{minWidth:220, flexShrink:0, padding:'10px 16px 10px 0', borderRight:`1px solid ${DIVIDER}`, marginRight:16, cursor:'pointer'}}>
                <div style={{display:'flex', justifyContent:'space-between', gap:10}}>
                  <span style={{fontSize:9.5, color:N500}}>{f.time}</span>
                  <span style={{fontSize:9.5, color:ACCENT_700}}>{f.fuente}</span>
                </div>
                <div style={{fontSize:9.5, color:ACCENT_700, fontWeight:700}}>{f.headline}</div>
                <div style={{fontSize:12, marginTop:2, lineHeight:1.4}}>{f.text}</div>
                {feedExpanded===f.i && <div style={{fontSize:11, color:N600, marginTop:6, lineHeight:1.5, borderLeft:`2px solid ${ACCENT}`, paddingLeft:8}}>{f.detalle}<div style={{marginTop:6, fontSize:10, color:N500}}>Actualizado {f.asOf} · Frecuencia {SOURCES[f.fuente]?.frequency || '—'} · {SOURCES[f.fuente] ? <a href={SOURCES[f.fuente].url} target="_blank" rel="noopener">fuente →</a> : '—'}</div></div>}
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{textAlign:'center', padding:'14px 24px', borderTop:`1px solid ${DIVIDER}`, fontSize:11.5, color:N600}}>
        <a href="index.html" style={{color:N600}}>Inicio DBCG</a> · <a href="index.html#trabajo" style={{color:N600}}>Cómo trabajo</a> · <a href="index.html#trayectoria" style={{color:N600}}>Trayectoria</a> · <a href="aviso-legal.html" style={{color:N600}}>Aviso legal</a> · <a href="politica-privacidad.html" style={{color:N600}}>Privacidad</a>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
