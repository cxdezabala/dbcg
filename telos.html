<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect, Fragment } = React;

// ── Constantes del recorrido educativo (PROMPT-claude-code.md §3) ──────────
// Economía real con horizonte natural. NO son los términos del producto (15 años,
// face amount, tabla de prima) — esos viven en el back del asesor. EFFICIENCY está
// calibrado sobre las 12 ilustraciones reales (media 0.9017, rango 0.898-0.906):
// ver PROJECTIONS-model.md. El benchmark del 3% nunca se manipula (regla §0.3).
const EDU = { GROWTH: 0.0408, ANNUITY_DUE_4: 3.761993, EFFICIENCY: 0.9017 };
const RATE = 0.03;
const RATE_LABEL = '3%';

function money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
function short(n) {
  if (n >= 1000000) return '$' + (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return '$' + Math.round(n / 1000) + 'K';
  return '$' + Math.round(n);
}
function yearsLabel(n) { return n + (n === 1 ? ' año' : ' años'); }
function fv(c, n) { return RATE === 0 ? c * n : c * ((Math.pow(1 + RATE, n) - 1) / RATE); }
function eduAccum(n) { const g = EDU.GROWTH; return n <= 0 ? 0 : (Math.pow(1 + g, n) - 1) / g; }

// El único tope con sentido para el usuario: que aportar hasta los 18 del hijo no se
// extienda más allá de su propio horizonte de retiro (PROMPT-claude-code.md §3).
function eduRange(parentAge, childAge) {
  const n = Math.max(18 - childAge, 0);
  const endsAt = parentAge + n;
  if (n < 1) return { ok: false, kind: 'child',
    reason: 'Tu hijo ya está en edad de iniciar sus estudios, así que no queda tiempo por delante para construir el capital de forma programada.' };
  if (endsAt > 65) return { ok: false, kind: 'parent-high', endsAt,
    reason: 'Aportarías hasta tus ' + endsAt + ' años: el esfuerzo educativo se extendería más allá de tu propio horizonte de retiro.' };
  return { ok: true, years: n, endsAt, confidence: n >= 8 ? 'Alta' : 'Media', tight: n < 8 };
}

// Aportación anual necesaria para un presupuesto anual de estudios dado.
function eduSolve(annualBudget, parentAge, childAge) {
  const n = Math.max(18 - childAge, 0);
  const valueAt18 = annualBudget * EDU.ANNUITY_DUE_4;
  const factor = eduAccum(n) * EDU.EFFICIENCY;
  const contribution = factor > 0 ? valueAt18 / factor : valueAt18;
  return { range: eduRange(parentAge, childAge), valueAt18, contribution,
    annualPayout: annualBudget, years: n, totalContributions: contribution * n };
}

function series(c, n) {
  const out = [];
  for (let y = 0; y <= n; y++) out.push({ y, contrib: c * y, value: fv(c, y) });
  return out;
}
function paths(data, w, h, pad, max) {
  const n = data.length - 1;
  const x = i => pad + (i / Math.max(n, 1)) * (w - pad);
  const y = v => h - (v / max) * (h - 8);
  const line = k => data.map((d, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(d[k]).toFixed(1)).join(' ');
  const area = k => line(k) + ' L' + x(n).toFixed(1) + ' ' + h + ' L' + pad + ' ' + h + ' Z';
  return { valueLine: line('value'), valueArea: area('value'), contribLine: line('contrib'), contribArea: area('contrib') };
}

const RET_STEPS = ['time','compound','capacity','level','discipline','projection','waiting','playground','compare','guide','learned','summary','meeting','deepen','nextsteps'];

const EDU_LABELS = ['Edades','Momento','Objetivo','Aportación','Nivel','Disciplina','Proyección','Esperar','Explorar','Comparar','Guía','Aprendido','Resumen','Profundizar','Pasos'];

const TAKEAWAYS = {
  edu: ['El tiempo es el recurso que no se puede recuperar.','El interés compuesto trabaja sobre lo aportado y sobre lo generado.','Un objetivo aproximado ya permite planificar.','La aportación sostenible vale más que la aportación máxima.','Empezar antes reduce el esfuerzo anual necesario.'],
  ret: ['El tiempo puede ser tan importante como la aportación.','El interés compuesto potencia el capital acumulado.','Construir desde tu capacidad hace sostenible la estrategia.','La disciplina en el tiempo marca la diferencia.','Pequeñas decisiones hoy generan diferencias relevantes mañana.']
};

const SUGGESTIONS = {
  edu: ['¿Por qué empezar antes cambia tanto el resultado?','¿Cómo funciona el interés compuesto?','¿Qué pasa si un año reduzco mi aportación?','¿Cómo puedo aproximar el coste futuro de la universidad?','¿Qué pasa si quiero cubrir también gastos de vida?'],
  ret: ['¿Por qué empezar antes puede marcar tanta diferencia?','¿Qué ocurre si aumento mi aportación?','¿Qué pasa si reduzco mi aportación?','¿Cómo funciona el interés compuesto?','¿Por qué la disciplina es importante?','¿Qué pasa si un año no puedo aportar?']
};

function answer(q, horizon, contrib) {
  const h = horizon, c = contrib, f = fv(c, h);
  const bank = [
    [/antes|empezar/i, 'Cada año adicional aporta dos cosas: una aportación más y un año más de rendimientos sobre todo lo acumulado. Con ' + h + ' años por delante, tu capital estimado es ' + money(f) + '. Con 5 años menos serían ' + money(fv(c, Math.max(h - 5, 0))) + '.'],
    [/aument/i, 'Si subieras la aportación un 20% (' + money(c * 1.2) + ' al año), el capital estimado pasaría de ' + money(f) + ' a ' + money(fv(c * 1.2, h)) + '. La relación es proporcional a la aportación; el tiempo es lo que multiplica.'],
    [/reduzco|reduc|menos/i, 'Bajar la aportación reduce el resultado de forma proporcional: con ' + money(c * 0.8) + ' al año el capital estimado sería ' + money(fv(c * 0.8, h)) + '. Es preferible una cifra menor sostenible que una alta que no puedas mantener.'],
    [/compuesto|interés|interes/i, 'El interés compuesto es el efecto de generar rendimientos sobre el capital acumulado y también sobre los rendimientos anteriores. En tu escenario, de ' + money(f) + ' estimados, ' + money(f - c * h) + ' vendrían del crecimiento acumulado.'],
    [/disciplina|constan/i, 'La disciplina convierte una decisión aislada en un sistema. Son ' + h + ' aportaciones de ' + money(c) + '; el resultado depende más de mantenerlas que de acertar con el momento.'],
    [/no puedo aportar|un año|salto|pausa/i, 'Si un año no aportas, pierdes esa aportación y los rendimientos que habría generado hasta el final del horizonte. En tu escenario, saltar un año equivale aproximadamente a ' + money(fv(c, h) - fv(c, h - 1)) + ' menos de capital estimado.'],
    [/universidad|coste futuro|matr/i, 'Una forma sencilla de aproximarlo: toma el coste anual actual, multiplícalo por los años de estudios y ajústalo por la subida de precios esperada. No necesitas exactitud: el objetivo es el orden de magnitud.'],
    [/gastos de vida/i, 'Cubrir matrícula más gastos de vida suele elevar el objetivo de forma notable. La consecuencia práctica es una aportación anual mayor, o bien empezar antes para que el tiempo haga más trabajo.']
  ];
  const hit = bank.find(([re]) => re.test(q));
  return hit ? hit[1] : 'En tu escenario actual: ' + h + ' años de horizonte, ' + money(c) + ' al año, ' + money(c * h) + ' aportados y ' + money(f) + ' de capital estimado al ' + RATE_LABEL + ' ilustrativo. Puedes ajustar cualquier variable en la pantalla de exploración para ver el efecto.';
}

// Persistencia mínima del escenario compartido (localStorage). TELOS-DEPLOY.md §1:
// en la versión estática sirve como puente hasta que exista api/ con @vercel/kv.
function persistScenario(payload) {
  try {
    localStorage.setItem('telos_scenario_' + payload.scenario_id, JSON.stringify(payload));
    const ids = JSON.parse(localStorage.getItem('telos_scenario_ids') || '[]');
    if (!ids.includes(payload.scenario_id)) {
      ids.push(payload.scenario_id);
      localStorage.setItem('telos_scenario_ids', JSON.stringify(ids));
    }
  } catch (e) { /* localStorage no disponible (modo privado, etc.) — no bloquea el flujo */ }
}

function Rail({ labels, step, onGo }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '6px 0 30px' }}>
      {labels.map((label, i) => (
        <div key={i} style={{ flex: 1, cursor: 'pointer', display: 'flex', flexDirection: 'column', gap: 6 }} onClick={() => onGo(i)}>
          <div style={{ height: 3, borderRadius: 99, background: i <= step ? 'var(--color-accent)' : 'var(--color-neutral-300)', transition: 'background .3s ease' }}></div>
          <span style={{ fontSize: 10.5, letterSpacing: '0.02em', color: i === step ? 'var(--color-accent)' : 'var(--color-neutral-500)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{label}</span>
        </div>
      ))}
    </div>
  );
}

function Chart({ chart, w = 900, h = 300 }) {
  return (
    <svg viewBox={'0 0 ' + w + ' ' + h} style={{ width: '100%', height: 'auto' }} role="img" aria-label="Proyección de capital">
      {chart.grid.map((g, i) => <line key={'gl' + i} x1="46" y1={g.y} x2={w} y2={g.y} stroke="var(--color-neutral-200)" strokeWidth="1" />)}
      {chart.grid.map((g, i) => <text key={'gt' + i} x="40" y={g.ty} fontSize="11" fill="var(--color-neutral-500)" textAnchor="end">{g.label}</text>)}
      <path d={chart.contribArea} fill="var(--color-neutral-300)" />
      <path d={chart.valueArea} fill="var(--color-accent-200)" />
      <path d={chart.valueLine} fill="none" stroke="var(--color-accent)" strokeWidth="2.5" />
      {chart.ticks && chart.ticks.map((t, i) => <text key={'tk' + i} x={t.x} y={h - 5} fontSize="11.5" fill="var(--color-neutral-500)" textAnchor={t.anchor}>{t.label}</text>)}
    </svg>
  );
}

function App() {
  const [journey, setJourney] = useState(null); // null | 'edu' | 'retiro'
  const [step, setStep] = useState(0);
  const [age, setAgeState] = useState(42);
  const [childAge, setChildAge] = useState(1);
  const [parentAge, setParentAge] = useState(35);
  const [income, setIncome] = useState(80000);
  const [pct, setPct] = useState(7.5);
  const [contrib, setContrib] = useState(6000);
  const [level, setLevel] = useState('cons');
  const [goalType, setGoalType] = useState(1);
  const [eduGoal, setEduGoal] = useState(100000);
  const [messages, setMessages] = useState([{ who: 'g', text: 'Hola. Conozco las variables de tu escenario. ¿En qué puedo ayudarte a entenderlo mejor?' }]);
  const [draft, setDraft] = useState('');
  const [typing, setTyping] = useState(false);
  const [scenarioId] = useState(() => 'TL-R-' + Math.floor(10000 + Math.random() * 89999));
  const [shareModal, setShareModal] = useState(false);
  const [shared, setShared] = useState(null);
  const [meetingStage, setMeetingStage] = useState('intro');
  const [calOffset, setCalOffset] = useState(0);
  const [book, setBook] = useState({ name: '', contact: '', country: '', date: '', time: '' });
  const typingTimer = useRef(null);
  useEffect(() => () => clearTimeout(typingTimer.current), []);

  const edu = journey === 'edu';
  const copy = edu ? COPY.edu : COPY.ret;
  const steps = edu ? EDU_STEPS : RET_STEPS;
  const labels = edu ? EDU_LABELS : RET_LABELS;
  const curAge = edu ? childAge : age;
  const targetAge = edu ? 18 : 65;
  const horizon = Math.max(targetAge - curAge, 1);
  const total = contrib * horizon;
  const futureValue = fv(contrib, horizon);
  const growth = futureValue - total;
  const lateHorizon = Math.max(horizon - 5, 0);
  const futureValueLate = fv(contrib, lateHorizon);

  function setAgeVal(v) { if (edu) setChildAge(v); else setAgeState(v); }
  function goStep(i) { setStep(Math.max(0, Math.min(i, steps.length - 1))); }

  function send(q) {
    const text = (q || '').trim();
    if (!text) return;
    setMessages(m => [...m, { who: 'u', text }]);
    setDraft('');
    setTyping(true);
    clearTimeout(typingTimer.current);
    typingTimer.current = setTimeout(() => {
      setMessages(m => [...m, { who: 'g', text: answer(text, horizon, contrib) }]);
      setTyping(false);
    }, 620);
  }

  const eduBudget = Math.round(eduGoal / 4);
  const range = eduRange(parentAge, childAge);
  const sol = eduSolve(eduBudget, parentAge, childAge);

  function scenarioPayload() {
    return {
      scenario_id: scenarioId,
      scenario_type: edu ? 'education' : 'retirement',
      current_age: curAge,
      target_retirement_age: targetAge,
      years_to_retirement: horizon,
      annual_net_income: income,
      selected_contribution_percentage: +(contrib / income * 100).toFixed(1),
      monthly_contribution: Math.round(contrib / 12),
      annual_contribution: contrib,
      total_nominal_contributions: contrib * horizon,
      parent_age: edu ? parentAge : undefined,

  function calendar() {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const base = new Date(today.getFullYear(), today.getMonth() + calOffset, 1);
    const months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const dows = ['L','M','X','J','V','S','D'];
    const first = (base.getDay() + 6) % 7;
    const days = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < first; i++) cells.push({ n: '', off: true, key: 'pad' + i });
    for (let d = 1; d <= days; d++) {
      const dt = new Date(base.getFullYear(), base.getMonth(), d);
      const dow = dt.getDay();
      const iso = base.getFullYear() + '-' + String(base.getMonth() + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      const off = dt < today || dow === 0 || dow === 6;
      const on = book.date === iso;
      cells.push({ n: String(d), off, iso, on, key: iso });
    }
    const slots = ['09:00', '11:00', '14:00', '16:00'];
    let summary = 'Selecciona un día y una hora.';
    if (book.date) {
      const [yy, mm, dd] = book.date.split('-').map(Number);
      const dt = new Date(yy, mm - 1, dd);
      const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
      summary = dias[dt.getDay()] + ' ' + dt.getDate() + ' de ' + months[dt.getMonth()] + (book.time ? ' a las ' + book.time + ' (hora local)' : ' · elige una hora');
    }
    return { monthLabel: months[base.getMonth()] + ' ' + base.getFullYear(), dows, cells, slots, summary };
  }

  const gridSteps = [0, 0.25, 0.5, 0.75, 1].map(f => ({ y: (300 - f * 292).toFixed(1), ty: (300 - f * 292 + 4).toFixed(1), label: short(max * f) }));

                <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                  <div className="field"><label>Nombre</label><input className="input" type="text" placeholder="Tu nombre" value={book.name} onChange={e => setBook({ ...book, name: e.target.value })} /></div>
                  <div className="field"><label>Email o WhatsApp</label><input className="input" type="text" placeholder="nombre@correo.com" value={book.contact} onChange={e => setBook({ ...book, contact: e.target.value })} /></div>
                  <div className="field"><label>País</label><input className="input" type="text" placeholder="País de residencia" value={book.country} onChange={e => setBook({ ...book, country: e.target.value })} /></div>
                </div>
                <div style={{ marginTop: 22 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12 }}>
                    <span style={{ fontSize: 13, fontWeight: 600, color: 'var(--color-neutral-700)' }}>Fecha y hora preferida</span>
                    <span style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8 }}>
                      <button className="btn btn-secondary btn-icon" style={{ borderRadius: 9, minHeight: 32, padding: '4px 10px', width: 'auto' }} onClick={() => setCalOffset(calOffset - 1)} aria-label="Mes anterior">‹</button>
                      <span style={{ fontSize: 13.5, fontWeight: 600, minWidth: '13ch', textAlign: 'center' }}>{cal.monthLabel}</span>
                      <button className="btn btn-secondary btn-icon" style={{ borderRadius: 9, minHeight: 32, padding: '4px 10px', width: 'auto' }} onClick={() => setCalOffset(calOffset + 1)} aria-label="Mes siguiente">›</button>
                    </span>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,minmax(0,1fr))', gap: 4, marginBottom: 6 }}>
                    {cal.dows.map((d, i) => <div key={i} style={{ textAlign: 'center', fontSize: 11, letterSpacing: '0.04em', textTransform: 'uppercase', color: 'var(--color-neutral-500)' }}>{d}</div>)}
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,minmax(0,1fr))', gap: 4 }}>
                    {cal.cells.map(c => (
                      <button key={c.key} style={{ height: 40, borderRadius: 10, border: '1px solid ' + (c.on ? 'var(--color-accent)' : c.off ? 'transparent' : 'var(--color-divider)'), background: c.on ? 'var(--color-accent)' : c.off ? 'transparent' : '#fff', color: c.on ? '#fff' : c.off ? 'var(--color-neutral-400)' : 'var(--color-text)', fontSize: 14, fontWeight: c.on ? 700 : 500, fontVariantNumeric: 'tabular-nums', cursor: c.off ? 'default' : 'pointer', fontFamily: 'inherit' }} disabled={c.off} onClick={() => !c.off && setBook({ ...book, date: c.iso })}>{c.n}</button>
                    ))}
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: 16 }}>
                    {cal.slots.map(t => {
                      const on = book.time === t;
                      return <button key={t} style={{ padding: '9px 16px', borderRadius: 99, border: '1px solid ' + (on ? 'var(--color-accent)' : 'var(--color-divider)'), background: on ? 'var(--color-accent-100)' : '#fff', color: on ? 'var(--color-accent-700)' : 'var(--color-neutral-700)', fontSize: 13.5, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit', fontVariantNumeric: 'tabular-nums' }} onClick={() => setBook({ ...book, time: t })}>{t}</button>;
                    })}
                  </div>
                  <div style={{ fontSize: 13, color: 'var(--color-neutral-600)', marginTop: 14 }}>{cal.summary}</div>
                </div>
                <div style={{ marginTop: 26, display: 'flex', gap: 12, justifyContent: 'center', alignItems: 'center' }}>
                  <button className="btn btn-primary" onClick={() => setMeetingStage('done')}>Confirmar reunión</button>
                  <button className="btn btn-ghost" style={{ fontSize: 13 }} onClick={() => setMeetingStage('intro')}>Volver</button>
                </div>
              </div>
              );
            })()}
            {meetingStage === 'done' && (
              <div style={{ maxWidth: 560, margin: '0 auto', background: '#fff', border: '1px solid var(--color-divider)', borderRadius: 18, padding: 48, boxShadow: 'var(--shadow-sm)', textAlign: 'center' }}>
                <svg width="46" height="46" viewBox="0 0 24 24" fill="none" style={{ margin: '0 auto 16px', display: 'block' }}><circle cx="12" cy="12" r="10" fill="var(--color-accent-100)"></circle><path d="M8 12.3 l2.6 2.6 L16 9.5" stroke="var(--color-accent)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"></path></svg>
                <h1 style={{ fontSize: 28, lineHeight: 1.15, letterSpacing: '-0.03em', margin: '0 0 10px' }}>Solicitud registrada</h1>
                <p style={{ fontSize: 15.5, lineHeight: 1.65, color: 'var(--color-neutral-700)', maxWidth: '42ch', margin: '0 auto 22px' }}>Te contactaremos para confirmar el horario de la conversación.</p>
                <div style={{ fontSize: 13, color: 'var(--color-neutral-600)' }}>{shared === true ? 'Compartiste tu escenario ' + scenarioId + ' como punto de partida de la conversación.' : shared === false ? 'Tu escenario no se compartió. La conversación empezará desde cero.' : ''}</div>
                <div style={{ marginTop: 26, display: 'flex', gap: 12, justifyContent: 'center' }}><button className="btn btn-secondary" onClick={() => goStep(steps.indexOf('playground'))}>Seguir explorando</button><button className="btn btn-ghost" style={{ fontSize: 13 }} onClick={() => goStep(step + 1)}>Continuar</button></div>
              </div>
            )}
            {shareModal && (
              <div style={{ position: 'fixed', inset: 0, background: 'rgba(20,21,43,.42)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, zIndex: 50, animation: 'cnFade .2s ease' }}>
                <div style={{ background: '#fff', borderRadius: 18, padding: 36, maxWidth: 520, width: '100%', boxShadow: 'var(--shadow-lg)', maxHeight: '88vh', overflow: 'auto', animation: 'cnRise .25s ease' }}>
                  <div style={{ fontSize: 11.5, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--color-accent-700)', fontWeight: 600 }}>¿Quieres compartir tu escenario?</div>
                  <p style={{ fontSize: 14.5, lineHeight: 1.65, color: 'var(--color-neutral-700)', margin: '12px 0 20px' }}>Hasta este momento tu exploración ha sido privada. Si decides compartir tu escenario, podremos utilizarlo como punto de partida de la conversación.</p>
                  {[{ k: 'Edad actual', v: yearsLabel(curAge) },{ k: 'Edad objetivo de retiro', v: yearsLabel(targetAge) },{ k: 'Aportación mensual', v: money(Math.round(contrib / 12)) },{ k: 'Aportación anual', v: money(contrib) },{ k: 'Total nominal aportado', v: money(total) },{ k: 'Referencia de ahorro al retiro', v: money(futureValue) }].map((r, i) => (
                    <div key={i} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 14, padding: '10px 0', borderTop: '1px solid var(--color-neutral-200)' }}>
                      <span style={{ color: 'var(--color-neutral-600)' }}>{r.k}</span><span style={{ fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{r.v}</span>
                    </div>
                  ))}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 24 }}>
                    <button className="btn btn-primary btn-block" onClick={() => { persistScenario(scenarioPayload()); setShareModal(false); setShared(true); setMeetingStage('form'); }}>Compartir mi escenario y continuar</button>
                    <button className="btn btn-secondary btn-block" onClick={() => { setShareModal(false); setShared(false); setMeetingStage('form'); }}>Agendar sin compartirlo</button>
                  </div>
                  <div style={{ textAlign: 'center', marginTop: 14 }}><button className="btn btn-ghost" style={{ fontSize: 13 }} onClick={() => setShareModal(false)}>Cancelar</button></div>
                </div>
              </div>
            )}
          </div>
        )}

        {steps[step] === 'deepen' && (
          <div style={{ maxWidth: 600, margin: '0 auto', background: '#fff', border: '1px solid var(--color-divider)', borderRadius: 18, padding: 48, boxShadow: 'var(--shadow-sm)', textAlign: 'center' }}>
            <h1 style={{ fontSize: 32, lineHeight: 1.15, letterSpacing: '-0.03em', margin: '0 0 14px' }}>{copy.deepenTitle}</h1>
            <p style={{ fontSize: 16, lineHeight: 1.65, color: 'var(--color-neutral-700)', maxWidth: '44ch', margin: '0 auto 32px' }}>{copy.deepenText}</p>
            <div style={{ width: 76, height: 76, borderRadius: 22, background: 'var(--color-accent-100)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 22px' }}>
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" strokeWidth="1.7" strokeLinecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10 h17 M8 5 V3 M16 5 V3"></path></svg>
            </div>
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 22 }}>Una conversación, sin compromiso.</div>
            <a className="btn btn-primary" href="https://www.linkedin.com" target="_blank" rel="noopener" style={{ gap: 9 }}>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95C20.2 8.75 21 11 21 14.1V21h-4v-6.1c0-1.45-.5-2.45-1.8-2.45-1.05 0-1.67.7-1.95 1.38-.1.24-.12.58-.12.92V21H9z"></path></svg>
              Contactar en LinkedIn
            </a>
            <div style={{ marginTop: 26 }}><button className="btn btn-ghost" style={{ fontSize: 13 }} onClick={() => goStep(step + 1)}>Ver próximos pasos</button></div>
          </div>
        )}

        {steps[step] === 'nextsteps' && (
          <div style={{ maxWidth: 720, margin: '0 auto', background: '#fff', border: '1px solid var(--color-divider)', borderRadius: 18, padding: 44, boxShadow: 'var(--shadow-sm)' }}>
            <div style={{ textAlign: 'center', marginBottom: 30 }}>
              <h1 style={{ fontSize: 34, lineHeight: 1.15, letterSpacing: '-0.03em', margin: '0 0 8px' }}>Próximos pasos</h1>
              <p style={{ fontSize: 16, color: 'var(--color-neutral-700)', margin: 0 }}>Lo que puedes hacer ahora.</p>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              <div className="card-link" style={{ display: 'flex', gap: 16, alignItems: 'center', background: 'var(--color-neutral-100)', border: '1px solid var(--color-divider)', borderRadius: 14, padding: 20, cursor: 'pointer' }} onClick={() => goStep(steps.indexOf('playground'))}>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" strokeWidth="1.7" strokeLinecap="round" style={{ flex: 'none' }}><path d="M4 8 h16 M4 14 h16"></path><circle cx="9" cy="8" r="2.4" fill="#fff"></circle><circle cx="15" cy="14" r="2.4" fill="#fff"></circle></svg>
                <div><div style={{ fontSize: 16, fontWeight: 700, color: 'var(--color-accent-700)' }}>Seguir explorando</div><div style={{ fontSize: 13.5, color: 'var(--color-neutral-600)' }}>Ajusta las variables y descubre más.</div></div>
              </div>
              <div className="card-link" style={{ display: 'flex', gap: 16, alignItems: 'center', background: 'var(--color-neutral-100)', border: '1px solid var(--color-divider)', borderRadius: 14, padding: 20, cursor: 'pointer' }} onClick={() => goStep(steps.indexOf('guide'))}>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" strokeWidth="1.7" strokeLinejoin="round" style={{ flex: 'none' }}><path d="M4 5 h16 v11 H9 l-5 4 z"></path></svg>
                <div><div style={{ fontSize: 16, fontWeight: 700, color: 'var(--color-accent-700)' }}>Preguntar a la Guía</div><div style={{ fontSize: 13.5, color: 'var(--color-neutral-600)' }}>Resuelve dudas sobre tu escenario.</div></div>
              </div>
              <div className="card-link" style={{ display: 'flex', gap: 16, alignItems: 'center', background: 'var(--color-neutral-100)', border: '1px solid var(--color-divider)', borderRadius: 14, padding: 20, cursor: 'pointer' }} onClick={() => pick(edu ? 'retiro' : 'edu')}>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" strokeWidth="1.7" strokeLinecap="round" style={{ flex: 'none' }}><path d="M12 4 v16 M4 12 h16"></path></svg>
                <div><div style={{ fontSize: 16, fontWeight: 700, color: 'var(--color-accent-700)' }}>{copy.otherJourney}</div><div style={{ fontSize: 13.5, color: 'var(--color-neutral-600)' }}>Construye el otro escenario desde cero.</div></div>
              </div>
            </div>
            <div style={{ textAlign: 'center', fontSize: 14, color: 'var(--color-neutral-600)', marginTop: 30 }}>Tú tienes el control. Tu futuro, tu decisión.</div>
          </div>
        )}

        </div>
      </div>
      )}
      <div style={{ textAlign: 'center', padding: '20px 40px 40px', fontSize: 12, color: 'var(--color-neutral-500)' }}>
        <a href="/telos/advisor">Acceso de asesores</a>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
