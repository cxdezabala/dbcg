      { name:'Energía industrial', precioRaw:'121 €/MWh', varInteranual:0.6, spark:'0,12 15,13 30,11 45,14 60,12 75,13 90,11 100,12', valorEq:'0,03 €/litro', formula:'Consumo medio de embotellado · IDAE', fuente:'IDAE', pesoEnCoste:7 },

function fmtPct(n) { const s = n.toFixed(1).replace('.', ','); return (n > 0 ? '+' : '') + s + '%'; }

function getSector(id, insumoIdx) {
  const raw = SECTORS_RAW.find(s => s.id === id) || SECTORS_RAW[0];
  return {
    ...raw,
    color: PRESION_COLORS[raw.presion],
    colorBg: PRESION_BG[raw.presion],
    presionLabel: raw.presion.toUpperCase(),
    varLabel: fmtPct(raw.varInteranual),
    insumos: raw.insumos.map((ins, i) => ({
      ...ins,
      varLabel: fmtPct(ins.varInteranual),
      varColor: ins.varInteranual >= 0 ? '#c9a227' : '#6b7280',
      idx: i,
    })),
  };
}

const FUENTE_URLS = {
  'MAPA': 'https://www.mapa.gob.es/es/estadistica/temas/estadisticas-agrarias/precios/',
  'INE': 'https://www.ine.es/',
  'OMIE': 'https://www.omie.es/es',
  'IDAE': 'https://www.idae.es/',
  'CORES': 'https://www.cores.es/es',
  'FEGA': 'https://www.fega.gob.es/',
};

function App() {
  const [view, setView] = useState('panel');
  const [sectorId, setSectorId] = useState('aceite');
  const [insumoIdx, setInsumoIdx] = useState(0);
  const [peso, setPeso] = useState(null);
  const [variacion, setVariacion] = useState(null);
  const [estrVars, setEstrVars] = useState({});
  const [expandedUpdate, setExpandedUpdate] = useState(null);

  const sector = getSector(sectorId, insumoIdx);

  const openSector = (id) => { setSectorId(id); setInsumoIdx(0); setPeso(null); setVariacion(null); setView('detalle'); };

  const times = ['hace 40 min', 'hace 1 h', 'hace 2 h', 'hace 4 h', 'hace 6 h', 'hace 9 h', 'hace 1 día', 'hace 1 día'];
  const updates = SECTORS_RAW.map((raw, i) => {
    const ins = raw.insumos[0];
    const dir = ins.varInteranual >= 0 ? 'al alza' : 'a la baja';
    const detalle = `El precio de ${ins.name.toLowerCase()} se mueve ${dir} (${fmtPct(ins.varInteranual)} interanual), dato publicado por ${ins.fuente}. Representa un ${ins.pesoEnCoste}% de la estructura de coste del sector ${raw.name.toLowerCase()}, por lo que una variación sostenida en esta dirección presiona el margen de la empresa tipo del vertical.`;
    return { time: times[i], text: `${raw.name}: ${ins.name} ${fmtPct(ins.varInteranual)} — ${ins.fuente}`, fuente: ins.fuente, detalle, i };
  });

  const estructura = sector.estructura.map(([label, pct, color]) => ({ label, color, pctLabel: pct + '%', pctStr: pct + '%' }));

  const costeActual0 = sector.costeTotalPct;
  let costeCombinadoNuevo = 0;
  const estructuraSim = sector.estructura.map(([label, pct, color], idx) => {
    const key = sectorId + '_' + idx;
    const v = estrVars[key] ?? 0;
    const shareRevenue = costeActual0 * (pct / 100);
    const contribPP = shareRevenue * (v / 100);
    costeCombinadoNuevo += shareRevenue * (1 + v / 100);
    return {
      label, color, pct, varValue: v, varLabel: fmtPct(v),
      contribLabel: (contribPP >= 0 ? '+' : '') + contribPP.toFixed(1) + ' pp',
      contribColor: contribPP > 0.05 ? '#c9a227' : (contribPP < -0.05 ? '#6b7280' : '#9aa0ab'),
      key,
    };
  });

  const insumo = sector.insumos[insumoIdx] || sector.insumos[0];
  const pesoVal = peso ?? insumo.pesoEnCoste;
  const variacionVal = variacion ?? Math.round(insumo.varInteranual);

  const costeActual = sector.costeTotalPct;
  const margenActual = 100 - costeActual;
  const costeNuevo = costeActual * (1 + (pesoVal / 100) * (variacionVal / 100));
  const margenNuevo = 100 - costeNuevo;
  const delta = margenNuevo - margenActual;
  const deltaColor = delta < -0.05 ? '#c9a227' : (delta > 0.05 ? '#6b7280' : '#9aa0ab');
  const deltaBg = delta < -0.05 ? 'rgba(201,162,39,.12)' : (delta > 0.05 ? 'rgba(107,114,128,.12)' : 'rgba(154,160,171,.12)');

  let narrativa;
  if (delta < -0.05) {
    narrativa = `Si ${insumo.name.toLowerCase()} sube un ${fmtPct(variacionVal)} y pesa un ${pesoVal}% de tu coste, tu margen bajaría de ${margenActual.toFixed(1)}% a ${margenNuevo.toFixed(1)}% — una pérdida de ${Math.abs(delta).toFixed(1)} puntos porcentuales que conviene anticipar en precio o en compra a plazo.`;
  } else if (delta > 0.05) {
    narrativa = `Con ${insumo.name.toLowerCase()} variando un ${fmtPct(variacionVal)}, tu margen mejoraría de ${margenActual.toFixed(1)}% a ${margenNuevo.toFixed(1)}%, ganando ${delta.toFixed(1)} puntos porcentuales.`;
  } else {
    narrativa = 'Con estos parámetros el impacto sobre el margen es prácticamente neutro.';
  }

  const margenCombinado = 100 - costeCombinadoNuevo;
  const deltaComb = margenCombinado - margenActual;
  const deltaCombColor = deltaComb < -0.05 ? '#c9a227' : (deltaComb > 0.05 ? '#6b7280' : '#9aa0ab');
  const deltaCombBg = deltaComb < -0.05 ? 'rgba(201,162,39,.12)' : (deltaComb > 0.05 ? 'rgba(107,114,128,.12)' : 'rgba(154,160,171,.12)');
  let simCombNarrativa;
  if (deltaComb < -0.05) {
    simCombNarrativa = `Sumando las variaciones que has fijado en cada partida de coste, el margen del vertical caería de ${margenActual.toFixed(1)}% a ${margenCombinado.toFixed(1)}%, una pérdida combinada de ${Math.abs(deltaComb).toFixed(1)} puntos porcentuales.`;
  } else if (deltaComb > 0.05) {
    simCombNarrativa = `Con estas variaciones combinadas, el margen mejoraría de ${margenActual.toFixed(1)}% a ${margenCombinado.toFixed(1)}%, ganando ${deltaComb.toFixed(1)} puntos porcentuales.`;
  } else {
    simCombNarrativa = 'Con los valores actuales de cada partida, el efecto combinado sobre el margen es prácticamente neutro.';
  }

  return (
    <div style={{minHeight:'100vh', display:'flex', flexDirection:'column'}}>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'18px 36px', background:'#05070d', color:'#eef0f4', borderBottom:'1px solid rgba(255,255,255,.08)'}}>
        <div style={{display:'flex', alignItems:'center', gap:14, cursor:'pointer'}} onClick={() => setView('panel')}>
          <div style={{display:'flex', gap:3, alignItems:'flex-end', height:18}}>
            <span style={{width:3, height:7, background:'#c9a227', borderRadius:2}}></span>
            <span style={{width:3, height:18, background:'#c9a227', borderRadius:2}}></span>
            <span style={{width:3, height:10, background:'#c9a227', borderRadius:2}}></span>
            <span style={{width:3, height:14, background:'#c9a227', borderRadius:2}}></span>
          </div>
          <span style={{fontFamily:"'Newsreader',serif", fontWeight:600, fontSize:21, letterSpacing:'-.01em'}}>PulsoPyme</span>
        </div>
        <div style={{display:'flex', gap:28, fontSize:13, color:'rgba(238,240,244,.6)'}}>
          <span style={{color: view==='panel' ? '#eef0f4' : 'rgba(238,240,244,.6)', cursor:'pointer'}} onClick={() => setView('panel')}>Panel</span>
          <span style={{color: view==='simulador' ? '#eef0f4' : 'rgba(238,240,244,.6)', cursor:'pointer'}} onClick={() => setView('simulador')}>Simulador</span>
          <span style={{color:'rgba(238,240,244,.35)'}} title="Próximamente">Informes</span>
          <span style={{color:'rgba(238,240,244,.35)'}} title="Próximamente">Alertas</span>
        </div>
      </div>

      {view === 'panel' && (
        <div style={{padding:'32px 36px 48px', maxWidth:1240, margin:'0 auto', width:'100%'}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:6}}>
            <div>
              <div style={{fontSize:11, letterSpacing:'.06em', textTransform:'uppercase', color:'rgba(201,162,39,.6)'}}>Pulso de costes — panel general</div>
              <div style={{fontFamily:"'Newsreader',serif", fontSize:29, fontWeight:600, marginTop:4}}>3 sectores laten con tensión alta</div>
            </div>
            <div style={{fontSize:11.5, color:'rgba(255,255,255,.45)', textAlign:'right'}}>Actualizado 27 jul 2026<br/>Fuentes: INE · MAPA · OMIE · CORES</div>
          </div>
          <div style={{height:1, background:'rgba(255,255,255,.08)', margin:'16px 0 22px'}}></div>
          <div style={{display:'grid', gridTemplateColumns:'1.7fr 1fr', gap:32, alignItems:'start'}}>
            <div>
              <div style={{display:'grid', gridTemplateColumns:'1.6fr .7fr .8fr 1.1fr 16px', padding:'0 4px 8px', fontSize:10, letterSpacing:'.06em', textTransform:'uppercase', color:'rgba(255,255,255,.4)', borderBottom:'1px solid rgba(255,255,255,.1)'}}>
                <span>Sector</span><span>Presión</span><span style={{textAlign:'right'}}>Var. interanual</span><span style={{textAlign:'right', paddingRight:8}}>12 meses</span><span></span>
              </div>
              {SECTORS_RAW.map(raw => {
                const color = PRESION_COLORS[raw.presion];
                return (
                  <div key={raw.id} style={{display:'grid', gridTemplateColumns:'1.6fr .7fr .8fr 1.1fr 16px', padding:'11px 4px', alignItems:'center', borderBottom:'1px solid rgba(255,255,255,.06)', cursor:'pointer'}} onClick={() => openSector(raw.id)}>
                    <span style={{fontSize:13}}>{raw.name}</span>
                    <span style={{fontSize:10.5, fontWeight:600, color}}>{raw.presion.toUpperCase()}</span>
                    <span style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:12.5, textAlign:'right', color}}>{fmtPct(raw.varInteranual)}</span>
                    <svg width="100%" height="20" viewBox="0 0 100 20" preserveAspectRatio="none" style={{display:'block'}}>
                      <polyline points={raw.spark} fill="none" stroke={color} strokeWidth="1"></polyline>
                    </svg>
                    <span style={{fontSize:12, color:'rgba(255,255,255,.3)', textAlign:'right'}}>›</span>
                  </div>
                );
              })}
            </div>
            <div>
              <div style={{fontSize:10, letterSpacing:'.06em', textTransform:'uppercase', color:'rgba(255,255,255,.4)', paddingBottom:8, borderBottom:'1px solid rgba(255,255,255,.1)'}}>Últimas actualizaciones</div>
              {updates.map(u => (
                <div key={u.i} style={{padding:'11px 0', borderBottom:'1px solid rgba(255,255,255,.06)', cursor:'pointer'}} onClick={() => setExpandedUpdate(expandedUpdate === u.i ? null : u.i)}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline'}}>
                    <span style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:10, color:'rgba(255,255,255,.35)'}}>{u.time}</span>
                    <span style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:9.5, color:'rgba(201,162,39,.7)'}}>{u.fuente}</span>
                  </div>
                  <div style={{fontSize:12.5, marginTop:3, lineHeight:1.4}}>{u.text}</div>
                  {expandedUpdate === u.i && (
                    <div style={{fontSize:11.5, color:'rgba(255,255,255,.55)', marginTop:7, lineHeight:1.55, borderLeft:'2px solid rgba(201,162,39,.4)', paddingLeft:9}}>{u.detalle}</div>
                  )}
                </div>
              ))}
            </div>
          </div>
          <div style={{marginTop:22, display:'flex', justifyContent:'space-between', alignItems:'center', padding:'13px 18px', border:'1px solid rgba(201,162,39,.25)', borderRadius:6}}>
            <span style={{fontSize:12.5, color:'#c9a227'}}>Próximamente: informes descargables por sector y alertas de precio configurables</span>
            <span style={{fontSize:11, color:'rgba(201,162,39,.5)'}}>En desarrollo</span>
          </div>
        </div>
      )}

      {view === 'detalle' && (
        <div style={{padding:'32px 36px 56px', maxWidth:1240, margin:'0 auto', width:'100%'}}>
          <div style={{fontSize:12.5, color:'rgba(255,255,255,.5)', marginBottom:10, cursor:'pointer'}} onClick={() => setView('panel')}>← Panel</div>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:8}}>
            <div>
              <div style={{display:'flex', alignItems:'center', gap:10}}>
                <span style={{fontFamily:"'Newsreader',serif", fontSize:30, fontWeight:600}}>{sector.name}</span>
                <span style={{fontSize:11, fontWeight:600, color:sector.color, background:sector.colorBg, padding:'4px 9px', borderRadius:20}}>{sector.presionLabel}</span>
              </div>
              <div style={{fontSize:12.5, color:'rgba(255,255,255,.5)', marginTop:4}}>CNAE-2025 · vertical comercial · variación interanual del índice compuesto: <b>{sector.varLabel}</b></div>
            </div>
            <div style={{textAlign:'right', flex:'none'}}>
              <div style={{fontSize:11, color:'rgba(255,255,255,.45)'}}>Fuentes: INE · MAPA · OMIE</div>
              <div onClick={() => setView('simulador')} style={{marginTop:8, background:'#c9a227', color:'#0a0e1a', fontSize:12.5, fontWeight:600, padding:'9px 16px', borderRadius:6, cursor:'pointer', display:'inline-block'}}>Simular impacto en margen →</div>
            </div>
          </div>

          <div style={{margin:'26px 0 10px', fontSize:11, letterSpacing:'.06em', textTransform:'uppercase', color:'rgba(201,162,39,.6)'}}>Ticker de materias primas clave</div>
          <div style={{display:'flex', gap:14, overflowX:'auto', paddingBottom:6}}>
            {sector.insumos.map((ins, i) => (
              <div key={i} style={{background:'#12151f', borderRadius:8, padding:'15px 16px', minWidth:220, flex:'none', border:'1px solid rgba(255,255,255,.08)'}}>
                <div style={{fontWeight:600, fontSize:13.5}}>{ins.name}</div>
                <svg width="100%" height="24" viewBox="0 0 100 24" preserveAspectRatio="none" style={{marginTop:8, display:'block'}}>
                  <polyline points={ins.spark} fill="none" stroke="#c9ccd2" strokeWidth="2"></polyline>
                </svg>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginTop:8}}>
                  <span style={{fontFamily:"'Newsreader',serif", fontSize:19, fontWeight:600}}>{ins.precioRaw}</span>
                  <span style={{fontSize:11.5, fontWeight:600, color:ins.varColor}}>{ins.varLabel}</span>
                </div>
                <div style={{fontSize:9.5, color:'rgba(255,255,255,.4)', marginTop:4}}>Fuente: {ins.fuente}</div>
              </div>
            ))}
          </div>

          <div style={{margin:'28px 0 10px', fontSize:11, letterSpacing:'.06em', textTransform:'uppercase', color:'rgba(201,162,39,.6)'}}>Capa de normalización — impacto por unidad de producto</div>
          <div style={{display:'flex', flexDirection:'column', gap:10}}>
            {sector.insumos.map((ins, i) => (
              <div key={i} style={{background:'#12151f', borderRadius:8, border:'1px solid rgba(255,255,255,.08)', display:'flex', alignItems:'stretch', overflow:'hidden'}}>
                <div style={{flex:1, padding:'16px 18px', borderRight:'1px dashed rgba(255,255,255,.15)'}}>
                  <div style={{fontSize:10.5, color:'rgba(255,255,255,.5)'}}>Precio de mercado</div>
                  <div style={{fontFamily:"'Newsreader',serif", fontSize:21, fontWeight:600, marginTop:3}}>{ins.precioRaw}</div>
                  <div style={{fontSize:10, color:'rgba(255,255,255,.4)', marginTop:2}}>{ins.name} · {ins.fuente}</div>
                </div>
                <div style={{display:'flex', alignItems:'center', padding:'0 14px'}}>
                  <span style={{width:8, height:8, borderRadius:'50%', background:'#c9a227', animation:'pp-pulse 1.8s ease-in-out infinite'}}></span>
                </div>
                <div style={{flex:1.3, padding:'16px 18px', background:'rgba(201,162,39,.08)'}}>
                  <div style={{fontSize:10.5, color:'#c9a227', fontWeight:600}}>Impacto por unidad de producto</div>
                  <div style={{fontFamily:"'Newsreader',serif", fontSize:21, fontWeight:600, color:'#c9a227', marginTop:3}}>≈ {ins.valorEq}</div>
                  <div style={{fontSize:10, color:'rgba(201,162,39,.75)', marginTop:2}}>{ins.formula}</div>
                </div>
              </div>
            ))}
          </div>

          <div style={{margin:'28px 0 10px', fontSize:11, letterSpacing:'.06em', textTransform:'uppercase', color:'rgba(201,162,39,.6)'}}>Indicadores estructurales del sector</div>
          <div style={{display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:14}}>
            <div style={{background:'#12151f', borderRadius:8, padding:'15px 16px', border:'1px solid rgba(255,255,255,.08)'}}>
              <div style={{fontSize:10.5, color:'rgba(255,255,255,.5)'}}>Empresas activas</div>
              <div style={{fontFamily:"'Newsreader',serif", fontSize:22, fontWeight:600, marginTop:4}}>{sector.empresas}</div>
              <div style={{fontSize:9.5, color:'rgba(255,255,255,.4)', marginTop:4}}>Fuente: INE — DIRCE</div>
            </div>
            <div style={{background:'#12151f', borderRadius:8, padding:'15px 16px', border:'1px solid rgba(255,255,255,.08)'}}>
              <div style={{fontSize:10.5, color:'rgba(255,255,255,.5)'}}>Empleo (afiliados)</div>
              <div style={{fontFamily:"'Newsreader',serif", fontSize:22, fontWeight:600, marginTop:4}}>{sector.empleo}</div>
              <div style={{fontSize:9.5, color:'rgba(255,255,255,.4)', marginTop:4}}>Fuente: INE — EPA</div>
            </div>
            <div style={{background:'#12151f', borderRadius:8, padding:'15px 16px', border:'1px solid rgba(255,255,255,.08)'}}>
              <div style={{fontSize:10.5, color:'rgba(255,255,255,.5)'}}>Altas de empresas (12m)</div>
              <div style={{fontFamily:"'Newsreader',serif", fontSize:22, fontWeight:600, marginTop:4, color:'#6b7280'}}>+{sector.altas}</div>
              <div style={{fontSize:9.5, color:'rgba(255,255,255,.4)', marginTop:4}}>Fuente: INE — DIRCE</div>
            </div>
            <div style={{background:'#12151f', borderRadius:8, padding:'15px 16px', border:'1px solid rgba(255,255,255,.08)'}}>
              <div style={{fontSize:10.5, color:'rgba(255,255,255,.5)'}}>Bajas de empresas (12m)</div>
              <div style={{fontFamily:"'Newsreader',serif", fontSize:22, fontWeight:600, marginTop:4, color:'#c9a227'}}>−{sector.bajas}</div>
              <div style={{fontSize:9.5, color:'rgba(255,255,255,.4)', marginTop:4}}>Fuente: INE — DIRCE</div>
            </div>
          </div>

          <div style={{margin:'28px 0 10px', fontSize:11, letterSpacing:'.06em', textTransform:'uppercase', color:'rgba(201,162,39,.6)'}}>Estructura de coste promedio real</div>
          <div style={{background:'#12151f', borderRadius:8, padding:18, border:'1px solid rgba(255,255,255,.08)'}}>
            <div style={{display:'flex', height:7, borderRadius:3, overflow:'hidden', gap:1}}>
              {estructura.map((e, i) => <div key={i} style={{width:e.pctStr, background:e.color}}></div>)}
            </div>
            <div style={{display:'flex', flexWrap:'wrap', gap:16, marginTop:14}}>
              {estructura.map((e, i) => (
                <div key={i} style={{display:'flex', alignItems:'center', gap:7, fontSize:12}}>
                  <span style={{width:9, height:9, borderRadius:2, background:e.color}}></span>
                  <span>{e.label}</span>
                  <span style={{color:'rgba(255,255,255,.45)'}}>{e.pctLabel}</span>
                </div>
              ))}
            </div>
            <div style={{fontSize:10, color:'rgba(255,255,255,.4)', marginTop:12}}>Estructura de coste promedio de empresa tipo del sector · Fuente: Banco de España — Central de Balances</div>
          </div>
        </div>
      )}

      {view === 'simulador' && (
        <div style={{padding:'32px 36px 56px', maxWidth:1080, margin:'0 auto', width:'100%'}}>
          <div style={{fontSize:12.5, color:'rgba(255,255,255,.5)', marginBottom:10, cursor:'pointer'}} onClick={() => setView('detalle')}>← {sector.name}</div>
          <div style={{fontFamily:"'Newsreader',serif", fontSize:28, fontWeight:600, marginBottom:4}}>Simulador de impacto en margen</div>
          <div style={{fontSize:12.5, color:'rgba(255,255,255,.5)', marginBottom:22}}>Empresa tipo del sector {sector.name} · ajusta el peso del insumo y la variación de precio esperada</div>

          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, alignItems:'start'}}>
            <div style={{background:'#12151f', borderRadius:8, padding:20, border:'1px solid rgba(255,255,255,.08)'}}>
              <div style={{fontSize:11, letterSpacing:'.06em', textTransform:'uppercase', color:'rgba(201,162,39,.6)', marginBottom:10}}>Insumo a simular</div>
              <div style={{display:'flex', gap:8, flexWrap:'wrap', marginBottom:20}}>
                {sector.insumos.map((ins, i) => (
                  <div key={i} onClick={() => { setInsumoIdx(i); setPeso(null); setVariacion(null); }} style={{padding:'7px 13px', borderRadius:20, fontSize:12.5, cursor:'pointer', background: i===insumoIdx ? '#c9a227' : '#12151f', color: i===insumoIdx ? '#0a0e1a' : '#eef0f4', border:`1px solid ${i===insumoIdx ? '#c9a227' : 'rgba(255,255,255,.15)'}`}}>{ins.name}</div>
                ))}
              </div>
              <div style={{fontSize:12.5, marginBottom:6}}>Peso del insumo en la estructura de coste: <b>{pesoVal}%</b></div>
              <input type="range" min="0" max="60" value={pesoVal} onChange={e => setPeso(Number(e.target.value))} style={{width:'100%', color:'#c9a227'}} />
              <div style={{fontSize:12.5, margin:'18px 0 6px'}}>Variación de precio esperada del insumo: <b>{fmtPct(variacionVal)}</b></div>
              <input type="range" min="-30" max="60" value={variacionVal} onChange={e => setVariacion(Number(e.target.value))} style={{width:'100%', color:'#c9a227'}} />
              <div style={{fontSize:10, color:'rgba(255,255,255,.4)', marginTop:16}}>Modelo simplificado de traspaso directo a coste, sin ajuste de sustitución ni repercusión a precio de venta. Base: estructura de coste promedio del sector, Banco de España — Central de Balances.</div>
            </div>

            <div style={{background:'#12151f', borderRadius:8, padding:20, border:'1px solid rgba(255,255,255,.08)'}}>
              <div style={{fontSize:11, letterSpacing:'.06em', textTransform:'uppercase', color:'rgba(201,162,39,.6)', marginBottom:14}}>Margen resultante</div>
              <div style={{display:'flex', alignItems:'baseline', gap:14, marginBottom:6}}>
                <div>
                  <div style={{fontSize:10.5, color:'rgba(255,255,255,.5)'}}>Actual</div>
                  <div style={{fontFamily:"'Newsreader',serif", fontSize:26, fontWeight:600, marginTop:4}}>{margenActual.toFixed(1)}%</div>
                </div>
                <span style={{fontSize:18, color:'rgba(255,255,255,.3)'}}>→</span>
                <div>
                  <div style={{fontSize:10.5, color:'rgba(255,255,255,.5)'}}>Proyectado</div>
                  <div style={{fontFamily:"'Newsreader',serif", fontSize:26, fontWeight:600, marginTop:4, color:deltaColor}}>{margenNuevo.toFixed(1)}%</div>
                </div>
                <div style={{marginLeft:'auto', fontSize:13, fontWeight:600, color:deltaColor, background:deltaBg, padding:'5px 11px', borderRadius:20}}>{(delta>=0?'+':'')+delta.toFixed(1)} pp</div>
              </div>
              <div style={{height:9, borderRadius:4, background:'rgba(255,255,255,.06)', position:'relative', overflow:'hidden', marginTop:14}}>
                <div style={{position:'absolute', left:0, top:0, bottom:0, background:'rgba(201,162,39,.4)', width: Math.min(100, Math.max(0, (margenActual/30)*100))+'%'}}></div>
                <div style={{position:'absolute', left:0, top:0, height:9, borderTop:`2px solid ${deltaColor}`, width: Math.min(100, Math.max(0, (margenNuevo/30)*100))+'%'}}></div>
              </div>
              <div style={{display:'flex', justifyContent:'space-between', fontSize:10, color:'rgba(255,255,255,.4)', marginTop:6}}>
                <span>0%</span><span>margen sobre ingresos</span><span>30%</span>
              </div>
              <div style={{marginTop:18, fontSize:13, lineHeight:1.6}}>{narrativa}</div>
            </div>
          </div>

          <div style={{marginTop:28, background:'#12151f', borderRadius:8, padding:20, border:'1px solid rgba(255,255,255,.08)'}}>
            <div style={{fontSize:11, letterSpacing:'.06em', textTransform:'uppercase', color:'rgba(201,162,39,.6)', marginBottom:4}}>Simulación combinada — estructura de coste completa</div>
            <div style={{fontSize:12, color:'rgba(255,255,255,.5)', marginBottom:16}}>Ajusta la variación esperada de cada partida a la vez y ve el efecto conjunto sobre el margen, unificando todas las variaciones definidas en la estructura de coste del vertical.</div>
            <div style={{display:'flex', flexDirection:'column', gap:14}}>
              {estructuraSim.map((p, idx) => (
                <div key={p.key} style={{display:'grid', gridTemplateColumns:'170px 1fr 90px 70px', gap:14, alignItems:'center'}}>
                  <div style={{display:'flex', alignItems:'center', gap:8, fontSize:12.5}}>
                    <span style={{width:9, height:9, borderRadius:2, background:p.color, flex:'none'}}></span>
                    <span>{p.label}</span>
                    <span style={{color:'rgba(255,255,255,.4)', fontSize:10.5}}>({p.pct}%)</span>
                  </div>
                  <input type="range" min="-30" max="60" value={p.varValue} onChange={e => setEstrVars({...estrVars, [p.key]: Number(e.target.value)})} style={{width:'100%', color:p.color}} />
                  <div style={{fontSize:12.5, textAlign:'right', fontWeight:500}}>{p.varLabel}</div>
                  <div style={{fontSize:11.5, textAlign:'right', color:p.contribColor}}>{p.contribLabel}</div>
                </div>
              ))}
            </div>
            <div style={{height:1, backgroundImage:'repeating-linear-gradient(90deg,rgba(201,162,39,.25) 0 6px,transparent 6px 12px)', margin:'18px 0'}}></div>
            <div style={{display:'flex', alignItems:'baseline', gap:14}}>
              <div>
                <div style={{fontSize:10.5, color:'rgba(255,255,255,.5)'}}>Margen actual</div>
                <div style={{fontFamily:"'Newsreader',serif", fontSize:24, fontWeight:600, marginTop:4}}>{margenActual.toFixed(1)}%</div>
              </div>
              <span style={{fontSize:18, color:'rgba(255,255,255,.3)'}}>→</span>
              <div>
                <div style={{fontSize:10.5, color:'rgba(255,255,255,.5)'}}>Margen combinado proyectado</div>
                <div style={{fontFamily:"'Newsreader',serif", fontSize:24, fontWeight:600, marginTop:4, color:deltaCombColor}}>{margenCombinado.toFixed(1)}%</div>
              </div>
              <div style={{marginLeft:'auto', fontSize:13, fontWeight:600, color:deltaCombColor, background:deltaCombBg, padding:'5px 11px', borderRadius:20}}>{(deltaComb>=0?'+':'')+deltaComb.toFixed(1)} pp</div>
            </div>
            <div style={{marginTop:10, fontSize:12.5, lineHeight:1.6}}>{simCombNarrativa}</div>
          </div>

          <div style={{marginTop:18, display:'flex', justifyContent:'space-between', alignItems:'center', padding:'13px 18px', background:'rgba(201,162,39,.06)', borderRadius:8}}>
            <span style={{fontSize:12.5, color:'#c9a227'}}>Próximamente: guarda escenarios y recibe alertas cuando la variación supere tu umbral de margen</span>
            <span style={{fontSize:11, color:'rgba(201,162,39,.5)'}}>En desarrollo</span>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
