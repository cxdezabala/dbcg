<script type="module">
// Los motores de proyección viven en el cliente (no son secretos, ver
// TELOS-DEPLOY.md §4) -- se cargan como módulo ES aparte y se exponen en
// window para que el bloque React/Babel (que no es un módulo) los use.
import { project } from '/telos/engine/projection-retirement.mjs';
import { projectEducation } from '/telos/engine/projection-education.mjs';
window.TelosEngine = { project, projectEducation };
window.dispatchEvent(new Event('telos-engine-ready'));
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

function useTelosEngine() {
  const [engine, setEngine] = useState(window.TelosEngine || null);
  useEffect(() => {
    if (engine) return;
    const onReady = () => setEngine(window.TelosEngine);
    window.addEventListener('telos-engine-ready', onReady);
    return () => window.removeEventListener('telos-engine-ready', onReady);
  }, [engine]);
  return engine;
}

function money(n) { return n == null || Number.isNaN(n) ? '—' : '$' + Math.round(n).toLocaleString('en-US'); }
function money2(n) { return n == null || Number.isNaN(n) ? '—' : '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function short(n) {
  if (n >= 1000000) return '$' + (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return '$' + Math.round(n / 1000) + 'K';
  return '$' + Math.round(n || 0);
}
function yearsLabel(n) { return n + (n === 1 ? ' año' : ' años'); }
const NA = 'Pendiente de validación';
const PREMIUM_END_AGE = 65;

// ── Retiro: análisis derivado de project() ──────────────────────────────
// Bisección para el IRR aproximado del valor garantizado -- mismo método que
// Telos Advisor.dc.html (fuente de verdad), portado literalmente.
function guaranteedIrr(annual, n, gcv) {
  let lo = -0.2, hi = 0.2;
  const f = r => (r === 0 ? annual * n : annual * ((Math.pow(1 + r, n) - 1) / r)) - gcv;
  for (let i = 0; i < 80; i++) { const mid = (lo + hi) / 2; if (f(mid) > 0) hi = mid; else lo = mid; }
  return (lo + hi) / 2;
}

function retirementAnalysis(lead, pr) {
  if (!pr.ok) return { ok: false };
  const annualIncome = pr.income * 12, diff = pr.projected - lead.benchmark_future_value;
  return {
    ok: true,
    difference_projected_vs_3: diff,
    difference_guaranteed_vs_3: pr.gcv - lead.benchmark_future_value,
    diff_monthly: Math.abs(diff) / (pr.years * 12), diff_annual: Math.abs(diff) / pr.years,
    gcv_ratio: pr.gcv / pr.total, pv_ratio: pr.projected / pr.total,
    guaranteed_irr: guaranteedIrr(lead.annual_contribution, pr.years, pr.gcv),
    income_monthly: pr.income, income_annual: annualIncome,
    income_multiple: annualIncome / lead.annual_contribution,
    break_even_years: pr.total / annualIncome,
    break_even_age: pr.settlement + pr.total / annualIncome
  };
}

// Construye todos los bloques de datos formateados (m, s1..s10, dbCurve,
// longChart) que usan las 10 pantallas del Retirement Room. Puerto literal
// de renderVals() en Telos Advisor.dc.html.
function buildRetirementRoom(lead, pr, longAge) {
  const a = retirementAnalysis(lead, pr);
  const na = NA;
  const m = pr.ok ? {
    benchmark: money(lead.benchmark_future_value),
    gcv: money(pr.gcv), projected: money(pr.projected),
    total: money(pr.total), settlement: pr.settlement + ' años', years: pr.years,
    annual: money(lead.annual_contribution), monthlyRef: 'equivale a ' + money2(lead.monthly_contribution) + ' / mes',
    periodLabel: lead.current_age + ' → ' + PREMIUM_END_AGE + ' · ' + pr.years + ' aportaciones',
    gcvRatio: (a.gcv_ratio * 100).toFixed(1) + '%',
    diff: (a.difference_projected_vs_3 < 0 ? '−' : '+') + money(Math.abs(a.difference_projected_vs_3)),
    diffMonthly: '≈ ' + money(a.diff_monthly) + ' / mes',
    diffAnnual: '≈ ' + money(a.diff_annual) + ' al año',
    incomeAnnual: money(a.income_annual), incomeMonthlyRef: 'equivale a ' + money(a.income_monthly) + ' / mes',
    multiple: a.income_multiple.toFixed(2) + '×',
    faceAmount: money(pr.face), db1: money(pr.db[0]),
    sourceIds: (pr.source_projection_ids || []).join(', '),
    cumulative: money(Math.max(a.income_annual * (longAge - pr.settlement), 0)),
    cumulativeMeta: 'desde los ' + pr.settlement + ' hasta los ' + longAge + ' años · ' + money(a.income_annual) + ' al año'
  } : {
    benchmark: money(lead.benchmark_future_value), gcv: na, projected: na,
    total: money(lead.total_nominal_contributions), settlement: na, years: lead.years_to_retirement,
    annual: money(lead.annual_contribution), monthlyRef: 'equivale a ' + money2(lead.monthly_contribution) + ' / mes',
    periodLabel: lead.current_age + ' → ' + lead.target_retirement_age,
    gcvRatio: na, diff: na, diffMonthly: na, diffAnnual: na,
    incomeAnnual: na, incomeMonthlyRef: na, multiple: na, faceAmount: na, db1: na,
    sourceIds: '—', cumulative: na, cumulativeMeta: na
  };

  const s1 = [
    { k: 'Edad actual', v: yearsLabel(lead.current_age), ref: '' },
    { k: 'Edad objetivo', v: yearsLabel(lead.target_retirement_age), ref: '' },
    { k: 'Aportación anual', v: money(lead.annual_contribution), ref: 'equivale a ' + money2(lead.monthly_contribution) + ' / mes' },
    { k: 'Periodo', v: yearsLabel(lead.years_to_retirement), ref: yearsLabel(lead.years_to_retirement) + ' aportaciones anuales' },
    { k: 'Total nominal aportado', v: money(lead.total_nominal_contributions), ref: '' },
    { k: 'Referencia al 3%', v: money(lead.benchmark_future_value), ref: 'supuesto hipotético' }
  ];
  const s2 = [
    { n: '01', short: 'Capacidad', t: '¿Cuánto puedes construir?',
      note: 'Ancla la conversación en lo que ya decidió en Telos: la aportación anual es suya y es real. No introduzcas estructura todavía; confirma que la cifra le sigue pareciendo sostenible.' },
    { n: '02', short: 'Interrupción', t: '¿Qué ocurre si no puedes terminar de construirlo?',
      note: 'Aquí aparece el riesgo que el ahorro tradicional no cubre. Pregunta y espera: casi nadie ha pensado qué pasa con el objetivo familiar si el periodo de aportación se interrumpe.' },
    { n: '03', short: 'Ingreso', t: '¿Cómo conviertes ese capital en ingresos durante el resto de tu vida?',
      note: 'Traslada el foco del monto acumulado al ingreso mensual. Es la pregunta que prepara la pantalla de renta vitalicia; no adelantes cifras aún.' }
  ];
  const s3a = [
    { k: 'Aportación anual', v: money(lead.annual_contribution), ref: money2(lead.monthly_contribution) + ' / mes' },
    { k: 'Periodo', v: yearsLabel(lead.years_to_retirement), ref: '' },
    { k: 'Total aportado', v: money(lead.total_nominal_contributions), ref: '' },
    { k: 'Supuesto educativo', v: '3% anual constante', ref: '' }
  ];
  const s3b = [
    { k: 'Misma aportación anual', v: money(lead.annual_contribution), ref: money2(lead.monthly_contribution) + ' / mes' },
    { k: 'Mismo periodo', v: yearsLabel(pr.ok ? pr.years : lead.years_to_retirement), ref: pr.ok ? 'prima hasta los ' + PREMIUM_END_AGE : '' },
    { k: 'Mismo total aportado', v: money(pr.ok ? pr.total : lead.total_nominal_contributions), ref: '' }
  ];
  const dbCurve = pr.ok ? [
    { k: 'Primera aportación', age: yearsLabel(lead.current_age), v: money(pr.db[0]), note: 'protección inicial', fg: 'var(--color-accent-700)' },
    { k: '5 años', age: yearsLabel(lead.current_age + 5), v: money(pr.db[1]), note: 'protección proyectada', fg: 'var(--color-neutral-900)' },
    { k: '10 años', age: yearsLabel(lead.current_age + 10), v: money(pr.db[2]), note: 'protección proyectada', fg: 'var(--color-neutral-900)' },
    { k: '15 años', age: yearsLabel(lead.current_age + 15), v: money(pr.db[3]), note: 'protección proyectada', fg: 'var(--color-neutral-900)' },
    { k: 'Settlement', age: yearsLabel(pr.settlement), v: money(pr.projected), note: 'valor proyectado disponible', fg: 'var(--color-accent-700)' }
  ] : [1, 2, 3, 4, 5].map((x, i) => ({ k: ['Primera aportación', '5 años', '10 años', '15 años', 'Settlement'][i], age: '—', v: na, note: '', fg: 'var(--color-neutral-500)' }));
  const s7 = [
    { n: '01', title: 'Capital', size: '22px', pad: '24px', edge: '1px solid var(--color-divider)', bg: '#fff', num: 'var(--color-neutral-500)',
      text: 'Acceder al capital disponible según las condiciones contractuales aplicables.', value: '' },
    { n: '02', title: 'Renta vitalicia', size: '26px', pad: '28px', edge: '1.5px dashed var(--color-accent-400)', bg: 'var(--color-accent-100)', num: 'var(--color-accent)',
      text: 'Recibir una renta proyectada de por vida según las condiciones contractuales aplicables.', value: pr.ok ? money(a.income_annual) + ' / año' : na },
    { n: '03', title: 'Ingreso', size: '22px', pad: '24px', edge: '1px solid var(--color-divider)', bg: '#fff', num: 'var(--color-neutral-500)',
      text: 'Mantener la estructura de capital y recibir ingresos periódicos según las condiciones contractuales aplicables.', value: '' }
  ];
  const s8 = [
    { k: 'Total nominal aportado', v: money(pr.ok ? pr.total : lead.total_nominal_contributions) },
    { k: 'Renta anual proyectada', v: pr.ok ? money(a.income_annual) : na },
    { k: 'Equivalencia nominal', v: pr.ok ? '≈ ' + a.break_even_years.toFixed(1) + ' años' : na }
  ];
  const s10 = [
    { title: 'Tu aporte', rows: [
      { k: 'Edad inicial', v: yearsLabel(lead.current_age), ref: '' },
      { k: 'Aportación anual', v: money(lead.annual_contribution), ref: money2(lead.monthly_contribution) + ' / mes' },
      { k: 'Periodo', v: yearsLabel(pr.ok ? pr.years : lead.years_to_retirement), ref: pr.ok ? 'prima hasta los ' + PREMIUM_END_AGE : '' },
      { k: 'Edad objetivo', v: yearsLabel(lead.target_retirement_age), ref: '' },
      { k: 'Total nominal aportado', v: money(pr.ok ? pr.total : lead.total_nominal_contributions), ref: '' }
    ] },
    { title: 'Acumulación', rows: [
      { k: 'Valor garantizado', v: m.gcv, ref: '' },
      { k: 'Valor proyectado (no garantizado)', v: m.projected, ref: '' },
      { k: 'Referencia al 3%', v: m.benchmark, ref: '' },
      { k: 'Diferencial vs 3%', v: m.diff, ref: m.diffAnnual }
    ] },
    { title: 'Durante el camino', rows: [
      { k: 'Protección familiar', v: m.faceAmount, ref: 'desde la primera aportación' },
      { k: 'Periodo cubierto', v: pr.ok ? lead.current_age + ' → ' + pr.settlement + ' años' : na, ref: '' }
    ] },
    { title: 'Al retiro', rows: [
      { k: 'Renta vitalicia proyectada', v: pr.ok ? money(a.income_annual) + ' / año' : na, ref: pr.ok ? money(a.income_monthly) + ' / mes' : '' },
      { k: 'Edad de settlement del producto', v: pr.ok ? pr.settlement + ' años' : na, ref: '' },
      { k: 'Lifetime income multiple', v: m.multiple, ref: 'renta anual / aporte anual' },
      { k: 'Break-even nominal', v: pr.ok ? a.break_even_age.toFixed(1) + ' años' : na, ref: '' }
    ] }
  ];

  const startAge = pr.ok ? pr.settlement : 65;
  const lgAges = [75, 80, 85, 90, 95];
  const longAgeOptions = lgAges.filter(x => x > startAge);
  const cum = lgAges.map(x => Math.max((pr.ok ? a.income_annual : 0) * (x - startAge), 0));
  const maxCum = Math.max(...cum, 1);
  const xAt = i => 52 + (i / (lgAges.length - 1)) * 560, yAt = v => 236 - (v / maxCum) * 220;
  const line = cum.map((v, i) => (i ? 'L' : 'M') + xAt(i).toFixed(1) + ' ' + yAt(v).toFixed(1)).join(' ');
  const selIdx = Math.max(lgAges.indexOf(longAge), 0);
  const longChart = {
    line, area: line + ' L612 236 L52 236 Z',
    grid: [0, 0.5, 1].map(f => ({ y: (236 - f * 220).toFixed(1), ty: (240 - f * 220).toFixed(1), label: short(maxCum * f) })),
    ticks: lgAges.map((x, i) => ({ x: xAt(i).toFixed(1), label: String(x) })),
    cx: xAt(selIdx).toFixed(1), cy: yAt(cum[selIdx]).toFixed(1)
  };

  const nextSteps = [
    { n: '1', t: 'Solicitar la ilustración contractual con la edad, la aportación anual y el face amount validados en Projection Data.' },
    { n: '2', t: 'Revisar con el usuario las condiciones aplicables y las opciones de settlement disponibles.' },
    { n: '3', t: 'Presentar la propuesta y la documentación oficial del proveedor fuera de Telos.' }
  ];

  return { m, s1, s2, s3a, s3b, dbCurve, s7, s8, s10, longAgeOptions, longChart, startAge, nextSteps };
}

// Construye todos los bloques de datos formateados (em, e1..e9, eduProtection)
// que usan las 9 pantallas del Education Room. Puerto literal de renderVals()
// en Telos Advisor.dc.html.
function buildEducationRoom(lead, epr) {
  const na = NA;
  const em = epr.ok ? {
    parentAge: yearsLabel(lead.parent_age), childAge: yearsLabel(lead.child_age),
    targetAge: '18 años', yearsTo: lead.years_to_education,
    monthly: money2(lead.monthly_contribution), annual: money(lead.annual_contribution),
    totalContrib: money(lead.total_nominal_contributions),
    budget: money(lead.annual_education_budget), objective: money(lead.total_education_objective),
    benchmark: money(lead.benchmark_future_value),
    gcv: money(epr.gcv_at_education), projected: money(epr.settlement),
    gcv15: money(epr.gcv_at_year_15), proj15: money(epr.projected_at_year_15),
    funding: money(epr.annual_funding), fundingExact: money2(epr.annual_funding),
    totalFunding: money(epr.total_funding),
    premium: money(epr.annual_premium), premiumMonthly: money2(epr.monthly_premium),
    totalPremiums: money(epr.total_premiums),
    childAtEnd: yearsLabel(epr.child_age_at_end), yearsAfter: epr.years_after_contributions,
    readYear: 'Año ' + epr.read_year, faceAmount: money(epr.face_amount),
    diff: (() => { const diff = epr.settlement - lead.benchmark_future_value; return (diff < 0 ? '−' : '+') + money(Math.abs(diff)); })(),
    diffMonthly: '≈ ' + money(Math.abs(epr.settlement - lead.benchmark_future_value) / (epr.contribution_years * 12)) + ' / mes',
    gcvRatio: (epr.gcv_at_education / lead.total_nominal_contributions * 100).toFixed(1) + '%',
    pvRatio: (epr.settlement / lead.total_nominal_contributions * 100).toFixed(1) + '%',
    sourceIds: (epr.source_projection_ids || []).join(', ')
  } : {
    parentAge: yearsLabel(lead.parent_age), childAge: yearsLabel(lead.child_age),
    targetAge: '18 años', yearsTo: lead.years_to_education,
    monthly: money2(lead.monthly_contribution), annual: money(lead.annual_contribution),
    totalContrib: money(lead.total_nominal_contributions),
    budget: money(lead.annual_education_budget), objective: money(lead.total_education_objective),
    benchmark: money(lead.benchmark_future_value),
    gcv: na, projected: na, gcv15: na, proj15: na, funding: na, fundingExact: na,
    totalFunding: na, premium: na, premiumMonthly: na, totalPremiums: na,
    childAtEnd: na, yearsAfter: na, readYear: na, faceAmount: na,
    diff: na, diffMonthly: na, gcvRatio: na, pvRatio: na, sourceIds: '—'
  };

  const e1 = [
    { k: 'Edad de tu hijo', v: em.childAge, ref: '' },
    { k: 'Edad objetivo', v: em.targetAge, ref: 'inicio de sus estudios' },
    { k: 'Años disponibles', v: yearsLabel(lead.years_to_education), ref: '' },
    { k: 'Aportación anual', v: em.annual, ref: 'equivale a ' + em.monthly + ' / mes' },
    { k: 'Objetivo anual educativo', v: em.budget, ref: 'cada año de carrera' },
    { k: 'Periodo educativo', v: '4 años', ref: '' },
    { k: 'Objetivo total', v: em.objective, ref: em.budget + ' × 4' },
    { k: 'Referencia Telos al 3%', v: em.benchmark, ref: 'supuesto hipotético' }
  ];
  const e2 = [
    { n: '01', t: '¿Cuánto puedes construir?',
      note: 'Ancla la conversación en la aportación que ya decidió en Telos. Confirma que sigue siendo sostenible antes de introducir cualquier estructura.' },
    { n: '02', t: '¿Qué ocurre si no puedes terminar de construirlo?',
      note: 'El riesgo que el ahorro puro no cubre. Pregunta y espera: casi nadie ha pensado qué pasa con la universidad de su hijo si el periodo de aportación se interrumpe.' },
    { n: '03', t: '¿Cómo conviertes ese capital en cuatro años de educación?',
      note: 'Traslada el foco del monto acumulado al presupuesto anual de carrera. Prepara la pantalla de financiación; no adelantes cifras todavía.' }
  ];
  const e3a = [
    { k: 'Aportación anual', v: em.annual },
    { k: 'Periodo', v: yearsLabel(lead.years_to_education) },
    { k: 'Total aportado', v: em.totalContrib },
    { k: 'Supuesto', v: '3% anual constante' }
  ];
  const e3b = [
    { k: 'Aportación anual aproximada', v: em.premium },
    { k: 'Periodo de aportación', v: epr.ok ? yearsLabel(epr.contribution_years) : na },
    { k: 'Total aportado', v: em.totalPremiums }
  ];
  const eduProtection = epr.ok ? (() => {
    const max = Math.max(...epr.protection.map(p => p.value), 1);
    const savings = y => lead.annual_contribution * ((Math.pow(1.03, y) - 1) / 0.03);
    return epr.protection.map(p => ({
      label: 'Año ' + p.year, protectedV: money(p.value), savedV: money(savings(p.year)),
      wProt: Math.round(p.value / max * 100) + '%', wSaved: Math.round(savings(p.year) / max * 100) + '%'
    }));
  })() : [];
  const e7 = epr.ok ? (() => {
    const savings = y => lead.annual_contribution * ((Math.pow(1.03, y) - 1) / 0.03);
    const pts = [{ label: 'Hoy', y: 0 }, { label: 'Año 5', y: 5 }, { label: 'Año 10', y: 10 }, { label: 'Año 15', y: 15 }].map(p => ({
      label: p.label, built: money(savings(p.y)),
      protectedV: p.y === 0 ? money(epr.protection[0].value) : money(epr.protection.find(x => x.year === p.y).value),
      edge: 'var(--color-divider)', bg: '#fff', fg: 'var(--color-neutral-600)'
    }));
    pts.push({ label: 'Educación', built: em.projected, protectedV: em.funding + ' / año',
      edge: 'var(--color-accent-300)', bg: 'var(--color-accent-100)', fg: 'var(--color-accent-800)' });
    return pts;
  })() : [];
  const e8 = [
    { k: 'Objetivo alcanzado', v: em.projected, note: 'El capital educativo proyectado queda disponible al inicio de sus estudios.' },
    { k: 'Si no se usa por completo', v: em.gcv, note: 'El valor garantizado permanece dentro de la estructura si el capital no se retira en su totalidad.' },
    { k: 'Continuidad', v: '—', note: 'La acumulación puede continuar o destinarse a un uso futuro alternativo, según las condiciones contractuales aplicables.' }
  ];
  const e9 = [
    { title: 'Objetivo', edge: 'var(--color-divider)', bg: '#fff', fg: 'var(--color-accent-700)', rows: [
      { k: 'Edad del hijo', v: em.childAge }, { k: 'Edad objetivo', v: em.targetAge },
      { k: 'Objetivo anual', v: em.budget }, { k: 'Periodo educativo', v: '4 años' }, { k: 'Objetivo total', v: em.objective }
    ] },
    { title: 'Esfuerzo', edge: 'var(--color-divider)', bg: '#fff', fg: 'var(--color-accent-700)', rows: [
      { k: 'Aportación anual', v: em.annual }, { k: 'Referencia mensual', v: em.monthly },

      { k: 'Total nominal aportado', v: em.totalPremiums }
    ] },
    { title: 'Referencia Telos', edge: 'var(--color-divider)', bg: '#fff', fg: 'var(--color-accent-700)', rows: [
      { k: 'Benchmark educativo 3%', v: em.benchmark }
    ] },
    { title: 'Estructura', edge: 'var(--color-divider)', bg: '#fff', fg: 'var(--color-accent-700)', rows: [
      { k: 'Valor educativo garantizado', v: em.gcv }, { k: 'Valor educativo proyectado', v: em.projected },
      { k: 'Diferencial económico', v: em.diff },
      { k: 'Protección del objetivo', v: epr.ok ? money(epr.protection[0].value) : na }
    ] },
    { title: 'Durante sus estudios', edge: 'var(--color-accent-300)', bg: 'var(--color-accent-100)', fg: 'var(--color-accent-800)', rows: [
      { k: 'Financiación anual proyectada', v: em.funding }, { k: 'Periodo', v: '× 4 años' }, { k: 'Total proyectado', v: em.totalFunding }
    ] }
  ];

  const nextSteps = [
    { n: '1', t: 'Solicitar la ilustración contractual con la edad del padre, la edad del hijo, la aportación anual y el face amount interno validados en Projection Data.' },
    { n: '2', t: 'Confirmar el punto de lectura de la curva (' + (epr.ok ? 'año ' + epr.read_year : 'pendiente') + ') y la financiación anual de los cuatro años de estudios.' },
    { n: '3', t: 'Presentar la propuesta y la documentación oficial del proveedor fuera de Telos.' }
  ];

  return { em, e1, e2, e3a, e3b, eduProtection, e7, e8, e9, nextSteps };
}

const STATES = ['Nueva reunión', 'Preparado', 'Completado'];
function stateColors(st) {

  if (st === 'Completado') return ['var(--color-neutral-200)', 'var(--color-neutral-700)', 'var(--color-neutral-400)'];
  return ['#fdf2f5', '#8a2b45', '#f6d6df'];

async function api(path, opts) {
  const res = await fetch(path, { credentials: 'same-origin', ...opts });
  let body = null;
  try { body = await res.json(); } catch (e) { /* sin cuerpo JSON */ }
  return { ok: res.ok, status: res.status, body };
}

function LoginScreen({ onSignedIn }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit() {
    if (busy) return;
    setBusy(true); setError('');
    const { ok, body } = await api('/api/telos-login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    setBusy(false);
    if (!ok) { setError((body && body.error) || 'Credenciales no válidas'); return; }
    onSignedIn();
  }

  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 40, background: 'var(--color-bg)' }}>
      <div style={{ width: '100%', maxWidth: 420, background: '#fff', border: '1px solid var(--color-divider)', borderRadius: 18, padding: 40, boxShadow: 'var(--shadow-md)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 26 }}>
          <div style={{ width: 26, height: 26, borderRadius: 8, background: 'var(--color-accent)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round"><path d="M4 19 L10 11 L14 15 L20 6"></path></svg>
          </div>
          <span style={{ fontWeight: 700, fontSize: 16, letterSpacing: '-0.02em' }}>Telos</span>
          <span style={{ fontSize: 11, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--color-accent-700)', fontWeight: 600, marginLeft: 2 }}>Advisor</span>
        </div>
        <h1 style={{ fontSize: 26, lineHeight: 1.15, letterSpacing: '-0.03em', margin: '0 0 8px' }}>Telos Advisor</h1>
        <p style={{ fontSize: 14.5, lineHeight: 1.6, color: 'var(--color-neutral-700)', margin: '0 0 26px' }}>Acceso exclusivo para asesores autorizados.</p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div className="field"><label>Email</label><input className="input" type="email" placeholder="asesor@dbcg.es" value={email} onChange={e => setEmail(e.target.value)} /></div>
          <div className="field"><label>Contraseña</label><input className="input" type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') submit(); }} /></div>
        </div>
        {error && <div style={{ fontSize: 13.5, color: 'var(--color-accent-2)', marginTop: 14 }}>{error}</div>}
        <div style={{ marginTop: 22 }}><button className="btn btn-primary btn-block" disabled={busy} onClick={submit}>{busy ? 'Accediendo…' : 'Acceder'}</button></div>
        <div style={{ fontSize: 12, color: 'var(--color-neutral-500)', marginTop: 26, lineHeight: 1.6 }}>Entorno privado. La información de escenarios se utiliza únicamente para preparar la conversación solicitada por el usuario.</div>
      </div>
    </div>
  );
}

function DecisionRoom({ lead, engine, presenting, setPresenting, onExit, onMarkCompleted }) {
  const edu = lead.scenario_type === 'education';
  const steps = edu ? EDU_DR_STEPS : RET_DR_STEPS;
  const labels = edu ? EDU_DR_LABELS : RET_DR_LABELS;
  const [drStep, setDrStep] = useState(0);
  const [longAge, setLongAge] = useState(85);
  const [nextOpen, setNextOpen] = useState(false);
  const notesOn = !presenting;

  const pr = engine ? (edu
    ? engine.projectEducation({ parent_age: lead.parent_age, child_age: lead.child_age, annual_contribution: lead.annual_contribution })
    : engine.project({ current_age: lead.current_age, annual_contribution: lead.annual_contribution })
  ) : null;

  if (!pr) return <div style={{ color: 'var(--color-neutral-500)' }}>Cargando motor de proyección…</div>;

  const val = pr.ok
    ? (pr.is_exact_projection
      ? { tag: 'Ilustración exacta', bg: 'var(--color-accent-100)', edge: 'var(--color-accent-200)', fg: 'var(--color-accent-800)' }
      : { tag: 'Interpolado', bg: 'var(--color-neutral-100)', edge: 'var(--color-neutral-300)', fg: 'var(--color-neutral-800)' })
    : { tag: 'Validation required', bg: '#fdf2f5', edge: '#f6d6df', fg: '#8a2b45' };

  const room = edu ? buildEducationRoom(lead, pr) : buildRetirementRoom(lead, pr, longAge);
  const step = steps[drStep];

  function next() { setDrStep(s => Math.min(s + 1, steps.length - 1)); }
  function prev() { setDrStep(s => Math.max(s - 1, 0)); }

  return (
    <div style={{ maxWidth: presenting ? 1180 : 1080, margin: '0 auto' }}>
      {!presenting && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap', marginBottom: 22 }}>
          <div>
            <h1 style={{ fontSize: 22, letterSpacing: '-0.03em' }}>{(edu ? 'Education' : 'Decision') + ' Room · ' + (lead.name || lead.scenario_id)}</h1>
            <div style={{ fontSize: 12.5, color: 'var(--color-neutral-600)', fontVariantNumeric: 'tabular-nums' }}>{lead.scenario_id} · {labels[drStep]}</div>
          </div>
          <div style={{ marginLeft: 'auto', display: 'flex', gap: 10, alignItems: 'center' }}>
            <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', color: val.fg, background: val.bg, border: '1px solid ' + val.edge, borderRadius: 99, padding: '6px 12px' }}>{val.tag}</span>
            <button className="btn btn-primary" onClick={() => setPresenting(true)}>Presentation Mode</button>
            <button className="btn btn-ghost" style={{ fontSize: 13 }} onClick={onExit}>← Volver al lead</button>
          </div>
        </div>
      )}

      <div style={{ background: '#fff', border: '1px solid var(--color-divider)', borderRadius: 18, padding: presenting ? 52 : 40, boxShadow: 'var(--shadow-sm)' }}>
        {edu
          ? <EducationRoomScreen step={step} room={room} notesOn={notesOn} onOpenNext={() => setNextOpen(true)} />
          : <RetirementRoomScreen step={step} room={room} notesOn={notesOn} longAge={longAge} setLongAge={setLongAge} onOpenNext={() => setNextOpen(true)} />}
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginTop: 20 }}>
        <button className="btn btn-secondary" onClick={prev} disabled={drStep === 0}>Anterior</button>
        <button className="btn btn-primary" onClick={next} disabled={drStep === steps.length - 1}>Siguiente</button>
        <span style={{ fontSize: 13, color: 'var(--color-neutral-600)', fontVariantNumeric: 'tabular-nums' }}>{(drStep + 1) + ' / ' + steps.length}</span>
        {presenting && <button className="btn btn-ghost" style={{ fontSize: 13, marginLeft: 'auto' }} onClick={() => setPresenting(false)}>Salir de la presentación</button>}
      </div>

      {nextOpen && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(20,21,43,.42)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, zIndex: 60 }}>
          <div style={{ background: '#fff', borderRadius: 18, padding: 36, maxWidth: 560, width: '100%', boxShadow: 'var(--shadow-lg)', maxHeight: '88vh', overflow: 'auto' }}>
            <div style={{ fontSize: 11.5, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--color-accent-700)', fontWeight: 600 }}>Explorar esta estructura</div>
            <h3 style={{ fontSize: 24, letterSpacing: '-0.03em', margin: '10px 0 8px' }}>Siguientes pasos, fuera de Telos</h3>
            <p style={{ fontSize: 14.5, lineHeight: 1.65, color: 'var(--color-neutral-700)', margin: '0 0 20px' }}>Telos cierra aquí su parte analítica. Lo contractual continúa con la documentación oficial del proveedor.</p>
            {room.nextSteps.map((n, i) => (
              <div key={i} style={{ display: 'flex', gap: 14, padding: '12px 0', borderTop: '1px solid var(--color-neutral-200)' }}>
                <span style={{ width: 24, height: 24, flex: 'none', borderRadius: '50%', background: 'var(--color-accent-100)', color: 'var(--color-accent-700)', fontSize: 12, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{n.n}</span>
                <span style={{ fontSize: 14.5, lineHeight: 1.6, color: 'var(--color-neutral-800)' }}>{n.t}</span>
              </div>
            ))}
            {notesOn && (
              <div style={{ marginTop: 20, display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
                <button className="btn btn-primary" onClick={() => { onMarkCompleted(); setNextOpen(false); }}>Marcar reunión como completada</button>
                <span style={{ fontSize: 12, color: 'var(--color-neutral-500)' }}>Solo cambia el estado interno del lead.</span>
              </div>
            )}
            <div style={{ textAlign: 'center', marginTop: 16 }}><button className="btn btn-ghost" style={{ fontSize: 13 }} onClick={() => setNextOpen(false)}>Cerrar</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const engine = useTelosEngine();
  const [authState, setAuthState] = useState('loading'); // loading | out | in
  const [email, setEmail] = useState('');
  const [section, setSection] = useState('overview');
  const [leads, setLeads] = useState([]);
  const [leadsLoading, setLeadsLoading] = useState(false);
  const [leadId, setLeadId] = useState(null);
  const [typeFilter, setTypeFilter] = useState('all');
  const [sourcesOpen, setSourcesOpen] = useState(false);
  const [savingStatus, setSavingStatus] = useState(false);
  const [presenting, setPresenting] = useState(false);

  const loadLeads = useCallback(async () => {
    setLeadsLoading(true);
    const { ok, body } = await api('/api/telos-leads');
    setLeadsLoading(false);
    if (ok) setLeads((body && body.leads) || []);
  }, []);

  useEffect(() => {
    (async () => {
      const { ok, body } = await api('/api/telos-session');
      if (ok) { setAuthState('in'); setEmail(body.email); loadLeads(); }
      else setAuthState('out');
    })();
  }, [loadLeads]);

  if (authState === 'loading') {
    return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--color-neutral-500)' }}>Cargando…</div>;
  }
  if (authState === 'out') {
    return <LoginScreen onSignedIn={() => { setAuthState('in'); loadLeads(); }} />;
  }

  async function signOut() {
    await api('/api/telos-logout', { method: 'POST' });
    setAuthState('out'); setLeads([]); setLeadId(null); setSection('overview');
  }

  async function setLeadState(scenarioId, state) {
    setSavingStatus(true);
    const { ok, body } = await api('/api/telos-lead-status', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scenario_id: scenarioId, state })
    });
    setSavingStatus(false);
    if (ok && body && body.lead) setLeads(ls => ls.map(l => l.scenario_id === scenarioId ? body.lead : l));
  }

  async function saveNotes(scenarioId, notes) {
    const { ok, body } = await api('/api/telos-lead-status', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scenario_id: scenarioId, notes })
    });
    if (ok && body && body.lead) setLeads(ls => ls.map(l => l.scenario_id === scenarioId ? body.lead : l));
  }

  const lead = leads.find(l => l.scenario_id === leadId) || null;
  const filteredLeads = leads.filter(l => typeFilter === 'all' || (l.scenario_type || 'retirement') === typeFilter);

            <div style={{ fontSize: 9.5, letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--color-accent-700)', fontWeight: 600 }}>Advisor</div>

                { k: 'projected_value_to_contributions_ratio', v: pr.total ? (pr.projected / pr.total * 100).toFixed(1) + '%' : na },
                { k: 'lifetime_income_multiple', v: pr.income ? ((pr.income * 12) / lead.annual_contribution).toFixed(2) + '×' : na },
                { k: 'nominal_break_even_years', v: pr.income ? (pr.total / (pr.income * 12)).toFixed(1) + ' años' : na }
              ] : [{ k: 'estado', v: na }] }
            ];
          }

          return (
            <div style={{ maxWidth: 1040 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
                <h1 style={{ fontSize: 30, letterSpacing: '-0.03em' }}>Projection Data</h1>
                <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--color-accent-2)', background: '#fdf2f5', border: '1px solid #f6d6df', borderRadius: 99, padding: '5px 11px' }}>Internal only</span>
              </div>
              <p style={{ fontSize: 15, color: 'var(--color-neutral-700)', margin: '8px 0 20px' }}>Capa de validación técnica. No forma parte de Presentation Mode. Lead: {lead.name || lead.scenario_id} · {lead.scenario_id}</p>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2,minmax(0,1fr))', gap: 16, alignItems: 'start' }}>
                {dataBlocks.map((b, i) => (
                  <div key={i} style={{ background: '#fff', border: '1px solid var(--color-divider)', borderRadius: 14, padding: 22, boxShadow: 'var(--shadow-sm)' }}>
                    <div style={{ fontSize: 11, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--color-neutral-600)', fontWeight: 600, marginBottom: 6 }}>{b.title}</div>
                    {b.rows.map((r, j) => (
                      <div key={j} style={{ display: 'flex', justifyContent: 'space-between', gap: 16, fontSize: 13.5, padding: '9px 0', borderTop: '1px solid var(--color-neutral-200)' }}>
                        <span style={{ color: 'var(--color-neutral-600)' }}>{r.k}</span><span style={{ fontWeight: 600, fontVariantNumeric: 'tabular-nums', textAlign: 'right' }}>{r.v}</span>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
              <div style={{ display: 'flex', gap: 12, marginTop: 22 }}>
                <button className="btn btn-secondary" onClick={() => setSourcesOpen(o => !o)}>{sourcesOpen ? 'Ocultar fuentes' : 'Ver fuentes'}</button>
              </div>
              {sourcesOpen && (
                <div style={{ background: '#fff', border: '1px solid var(--color-divider)', borderRadius: 14, padding: 22, marginTop: 16 }}>
                  <div style={{ fontSize: 11, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--color-neutral-600)', fontWeight: 600, marginBottom: 10 }}>{edu ? 'Ilustraciones de referencia · educación' : 'Ilustraciones de referencia · Abundance'}</div>
                  <div style={{ fontSize: 12.5, color: 'var(--color-neutral-500)', lineHeight: 1.6, marginBottom: 14 }}>Fuente citada para este escenario: {(pr.source_projection_ids || []).join(', ') || '—'}. {edu
                    ? '12 ilustraciones educativas reales (edades del padre 30–45 × edades del hijo 0/2/3 × face amounts internos 70,000/100,000/200,000).'
                    : '21 ilustraciones reales (edades 30–55 × face amounts 75,000/147,000/200,000/322,500). Prima pagada hasta los 65 años en todos los casos; la edad de settlement varía.'} Toda estimación no exacta debe validarse mediante ilustración contractual antes de presentarse.</div>
                </div>
              )}
            </div>
          );
        })()}

        {section === 'room' && !lead && (
          <div style={{ maxWidth: 700 }}><p style={{ color: 'var(--color-neutral-600)' }}>Abre primero un lead desde <button className="btn btn-ghost" style={{ fontSize: 14 }} onClick={() => setSection('leads')}>la lista de Leads</button>.</p></div>
        )}
        {section === 'room' && lead && (
          <DecisionRoom lead={lead} engine={engine} presenting={presenting} setPresenting={setPresenting}
            onExit={() => setSection('lead')}
            onMarkCompleted={() => setLeadState(lead.scenario_id, 'Completado')} />
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
